<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Music Player</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: #fff;
}


/* =========================================================
   MAIN PLAYER
========================================================= */

.player {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #050505;

    isolation: isolate;
}


/* =========================================================
   BLURRED BACKGROUND
========================================================= */

.background {
    position: absolute;

    top: -70px;
    right: -70px;
    bottom: -70px;
    left: -70px;

    z-index: -5;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    filter: blur(48px);

    transform: scale(1.14);

    transition:
        background-image 0.45s ease;
}


.background-overlay {
    position: absolute;

    inset: 0;

    z-index: -4;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.16),
            rgba(0,0,0,0.08) 35%,
            rgba(0,0,0,0.34) 65%,
            rgba(0,0,0,0.86) 100%
        );

    pointer-events: none;
}


/* =========================================================
   CONTENT
========================================================= */

.content {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        max(10px, env(safe-area-inset-top))
        22px
        max(12px, env(safe-area-inset-bottom))
        22px;
}


/* =========================================================
   DYNAMIC ISLAND
========================================================= */

.dynamic-island {
    position: absolute;

    top: max(7px, env(safe-area-inset-top));

    left: 50%;

    transform: translateX(-50%);

    width: 124px;
    height: 35px;

    border-radius: 999px;

    background: #000;

    z-index: 30;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.45);
}

.dynamic-island::after {
    content: "";

    position: absolute;

    right: 14px;
    top: 50%;

    width: 7px;
    height: 7px;

    transform: translateY(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #41464f,
            #111318 55%,
            #050505
        );
}


/* =========================================================
   TOP
========================================================= */

.top {
    width: 100%;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.top-label {
    margin-top: 8px;

    font-size: 15px;
    font-weight: 600;

    letter-spacing: -0.2px;

    opacity: 0.94;
}


/* =========================================================
   COVER
========================================================= */

.cover-area {
    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 4px 0 8px;
}

.cover-button {
    position: relative;

    width: min(74vw, 350px);
    height: min(74vw, 350px);

    padding: 0;

    border: 0;
    outline: none;

    border-radius: 8px;

    overflow: hidden;

    background: transparent;

    cursor: pointer;

    box-shadow:
        0 28px 65px rgba(0,0,0,0.52);
}

.cover-image {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    user-select: none;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.cover-button:active .cover-image {
    transform: scale(0.975);
}


/* =========================================================
   SONG INFORMATION
========================================================= */

.song-info {
    width: 100%;
    max-width: 560px;

    flex-shrink: 0;
}


/* =========================================================
   TITLE MARQUEE
========================================================= */

.title-window {
    width: 100%;

    overflow: hidden;

    white-space: nowrap;
}

.title-track {
    display: inline-flex;

    width: max-content;

    white-space: nowrap;
}

.song-title,
.song-title-copy {
    display: inline-block;

    font-size: 21px;
    line-height: 27px;

    font-weight: 700;

    letter-spacing: -0.55px;
}

.song-title-copy {
    padding-left: 60px;
}

.title-track.scrolling {
    animation:
        marquee
        10s
        linear
        infinite;
}

@keyframes marquee {

    0%,
    8% {
        transform: translateX(0);
    }

    92%,
    100% {
        transform: translateX(-50%);
    }

}


/* =========================================================
   ARTIST
========================================================= */

.artist-row {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 7px;

    margin-top: 1px;
}

.artist {
    max-width: calc(100% - 30px);

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    color:
        rgba(255,255,255,0.68);

    font-size: 15px;
    line-height: 22px;

    font-weight: 500;
}

.edit-artist {
    border: 0;
    outline: none;

    background: transparent;

    color:
        rgba(255,255,255,0.62);

    font-size: 14px;

    cursor: pointer;

    padding: 2px 5px;
}


/* =========================================================
   SMALL SPECTRUM
========================================================= */

.spectrum-area {
    position: relative;

    width: 100%;
    max-width: 560px;

    height: 66px;

    flex-shrink: 0;

    margin-top: 5px;

    overflow: hidden;
}

#spectrum {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =========================================================
   PLAY BUTTON
========================================================= */

.play-button {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 48px;
    height: 48px;

    transform:
        translate(-50%, -50%);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: 0;
    outline: none;

    background: transparent;

    cursor: pointer;

    z-index: 5;
}

.play-button:active {
    transform:
        translate(-50%, -50%)
        scale(0.88);
}


/* =========================================================
   PLAY ICON
========================================================= */

.play-icon {
    width: 0;
    height: 0;

    margin-left: 4px;

    border-top:
        9px solid transparent;

    border-bottom:
        9px solid transparent;

    border-left:
        14px solid #fff;

    filter:
        drop-shadow(
            0 0 5px rgba(255,255,255,0.4)
        );
}

.play-icon.pause {
    width: 15px;
    height: 19px;

    margin-left: 0;

    border: 0;

    background:
        linear-gradient(
            to right,
            #fff 0 4px,
            transparent 4px 11px,
            #fff 11px 15px
        );

    filter:
        drop-shadow(
            0 0 5px rgba(255,255,255,0.4)
        );
}


/* =========================================================
   TIME
========================================================= */

.time-row {
    width: 100%;
    max-width: 560px;

    display: flex;
    justify-content: space-between;

    margin-top: 0;

    flex-shrink: 0;

    color:
        rgba(255,255,255,0.58);

    font-size: 10px;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   VOLUME
========================================================= */

.volume-row {
    width: 100%;
    max-width: 560px;

    height: 34px;

    display: flex;
    align-items: center;

    gap: 9px;

    flex-shrink: 0;

    margin-top: 2px;
}

.volume-icon {
    width: 18px;
    height: 18px;

    flex-shrink: 0;

    opacity: 0.82;
}

.volume-icon svg {
    width: 100%;
    height: 100%;

    fill: #fff;
}

.volume-slider {
    width: 100%;
    height: 3px;

    appearance: none;
    -webkit-appearance: none;

    border: 0;
    outline: 0;

    border-radius: 999px;

    background:
        linear-gradient(
            to right,
            #fff 0%,
            #fff var(--volume),
            rgba(255,255,255,0.24) var(--volume),
            rgba(255,255,255,0.24) 100%
        );
}

.volume-slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 12px;
    height: 12px;

    border: 0;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}

.volume-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;

    border: 0;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions {
    width: 100%;
    max-width: 560px;

    height: 37px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 9px;

    flex-shrink: 0;
}

.action {
    height: 30px;

    padding:
        0 13px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 18px;

    background:
        rgba(255,255,255,0.07);

    color: #fff;

    font-size: 11px;
    font-weight: 600;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    cursor: pointer;
}

.action:active {
    transform: scale(0.96);
}


/* =========================================================
   HIDDEN INPUT
========================================================= */

input[type="file"] {
    display: none;
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {

    .player {
        width: min(100vw, 560px);
        height: 100vh;

        margin: 0 auto;
    }

}


/* =========================================================
   SHORT SCREEN
========================================================= */

@media (max-height: 720px) {

    .top {
        height: 45px;
    }

    .cover-button {
        width: min(62vw, 290px);
        height: min(62vw, 290px);
    }

    .spectrum-area {
        height: 58px;
    }

    .actions {
        height: 32px;
    }

}


/* =========================================================
   VERY SHORT SCREEN
========================================================= */

@media (max-height: 580px) {

    .top {
        height: 38px;
    }

    .cover-button {
        width: min(50vw, 220px);
        height: min(50vw, 220px);
    }

    .song-title,
    .song-title-copy {
        font-size: 18px;
        line-height: 23px;
    }

    .spectrum-area {
        height: 48px;
    }

    .volume-row {
        height: 28px;
    }

    .actions {
        display: none;
    }

}

</style>
</head>


<body>


<div class="player" id="player">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div
        class="background"
        id="background">
    </div>

    <div
        class="background-overlay">
    </div>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <div class="content">


        <!-- =================================================
             DYNAMIC ISLAND
        ================================================== -->

        <div class="dynamic-island"></div>


        <!-- =================================================
             TOP
        ================================================== -->

        <div class="top">

            <div class="top-label">
                Music
            </div>

        </div>


        <!-- =================================================
             COVER
        ================================================== -->

        <div class="cover-area">

            <button
                class="cover-button"
                id="coverButton"
                aria-label="Ganti foto">

                <img
                    class="cover-image"
                    id="coverImage"
                    src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1000&q=90"
                    alt="Cover"
                    draggable="false">

            </button>

        </div>


        <!-- =================================================
             SONG INFO
        ================================================== -->

        <div class="song-info">


            <div
                class="title-window"
                id="titleWindow">

                <div
                    class="title-track"
                    id="titleTrack">

                    <span
                        class="song-title"
                        id="songTitle">

                        Your Music

                    </span>

                    <span
                        class="song-title-copy"
                        id="songTitleCopy">

                        Your Music

                    </span>

                </div>

            </div>


            <div class="artist-row">

                <div
                    class="artist"
                    id="artist">

                    Your Artist

                </div>


                <button
                    class="edit-artist"
                    id="editArtist">

                    ✎

                </button>

            </div>

        </div>


        <!-- =================================================
             SMALL SPECTRUM
        ================================================== -->

        <div class="spectrum-area">

            <canvas
                id="spectrum">
            </canvas>


            <button
                class="play-button"
                id="playButton"
                aria-label="Play">

                <div
                    class="play-icon"
                    id="playIcon">
                </div>

            </button>

        </div>


        <!-- =================================================
             TIME
        ================================================== -->

        <div class="time-row">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>


        <!-- =================================================
             VOLUME
        ================================================== -->

        <div class="volume-row">


            <div class="volume-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M3 9v6h4l5 4V5L7 9H3zm13.5
                        3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73
                        2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86
                        5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91
                        7-4.49 7-8.77s-2.99-7.86-7-8.77z">
                    </path>

                </svg>

            </div>


            <input
                type="range"
                class="volume-slider"
                id="volumeSlider"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                style="--volume:80%;">

        </div>


        <!-- =================================================
             ACTION BUTTONS
        ================================================== -->

        <div class="actions">

            <button
                class="action"
                id="audioButton">

                Ganti Audio

            </button>


            <button
                class="action"
                id="coverButtonBottom">

                Ganti Foto

            </button>

        </div>


    </div>


    <!-- =====================================================
         AUDIO
    ====================================================== -->

    <audio
        id="audio"
        preload="metadata">
    </audio>


    <!-- =====================================================
         FILE PICKERS
    ====================================================== -->

    <input
        type="file"
        id="audioInput"
        accept="audio/*">


    <input
        type="file"
        id="coverInput"
        accept="image/*">


</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const player =
    document.getElementById("player");

const background =
    document.getElementById("background");

const coverButton =
    document.getElementById("coverButton");

const coverButtonBottom =
    document.getElementById("coverButtonBottom");

const coverImage =
    document.getElementById("coverImage");

const coverInput =
    document.getElementById("coverInput");

const audio =
    document.getElementById("audio");

const audioInput =
    document.getElementById("audioInput");

const audioButton =
    document.getElementById("audioButton");

const playButton =
    document.getElementById("playButton");

const playIcon =
    document.getElementById("playIcon");

const artist =
    document.getElementById("artist");

const editArtist =
    document.getElementById("editArtist");

const songTitle =
    document.getElementById("songTitle");

const songTitleCopy =
    document.getElementById("songTitleCopy");

const titleTrack =
    document.getElementById("titleTrack");

const titleWindow =
    document.getElementById("titleWindow");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const volumeSlider =
    document.getElementById("volumeSlider");

const canvas =
    document.getElementById("spectrum");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   VARIABLES
========================================================= */

let audioURL = null;

let coverURL = null;

let audioContext = null;

let analyser = null;

let source = null;

let frequencyData = null;

let analyserStarted = false;


/* =========================================================
   SMALL SPECTRUM SETTINGS
========================================================= */

const BAR_COUNT = 64;

const bars =
    new Array(BAR_COUNT).fill(0);


/* =========================================================
   INITIAL COVER
========================================================= */

const initialCover =
    coverImage.src;


background.style.backgroundImage =
    `
    linear-gradient(
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.60)
    ),
    url("${initialCover}")
    `;


/* =========================================================
   AUDIO ANALYSER
========================================================= */

function setupAudioAnalyser() {

    if (analyserStarted) {
        return;
    }


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContextClass) {
        return;
    }


    audioContext =
        new AudioContextClass();


    analyser =
        audioContext.createAnalyser();


    /*
        FFT cukup detail
        tetapi tetap ringan.
    */

    analyser.fftSize = 1024;


    /*
        Respons cepat.
    */

    analyser.smoothingTimeConstant = 0.32;


    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    source =
        audioContext.createMediaElementSource(
            audio
        );


    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );


    analyserStarted = true;

}


/* =========================================================
   RESUME AUDIO
========================================================= */

async function resumeAudio() {

    setupAudioAnalyser();


    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {

        try {

            await audioContext.resume();

        } catch (error) {

            console.log(error);

        }

    }

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

playButton.addEventListener(
    "click",
    async function () {

        /*
            Kalau belum ada musik,
            langsung buka file picker.
        */

        if (!audio.src) {

            audioInput.click();

            return;

        }


        await resumeAudio();


        if (audio.paused) {

            try {

                await audio.play();

            } catch (error) {

                console.log(error);

            }

        } else {

            audio.pause();

        }

    }
);


/* =========================================================
   PLAY
========================================================= */

audio.addEventListener(
    "play",
    function () {

        playIcon.classList.add("pause");

    }
);


/* =========================================================
   PAUSE
========================================================= */

audio.addEventListener(
    "pause",
    function () {

        playIcon.classList.remove("pause");

    }
);


/* =========================================================
   AUDIO FILE
========================================================= */

audioInput.addEventListener(
    "change",
    function (event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        /*
            Hapus URL lama.
        */

        if (audioURL) {

            URL.revokeObjectURL(
                audioURL
            );

        }


        /*
            Buat URL lokal.
        */

        audioURL =
            URL.createObjectURL(file);


        audio.src =
            audioURL;


        audio.load();


        /*
            Nama file menjadi
            judul lagu.
        */

        let title =
            file.name;


        title =
            title.replace(
                /\.[^/.]+$/,
                ""
            );


        title =
            title.replace(
                /[_-]+/g,
                " "
            );


        title =
            title.trim();


        songTitle.textContent =
            title;


        songTitleCopy.textContent =
            title;


        updateMarquee();


        currentTime.textContent =
            "0:00";


        duration.textContent =
            "0:00";


        audioInput.value = "";


        setupAudioAnalyser();

    }
);


/* =========================================================
   AUDIO BUTTON
========================================================= */

audioButton.addEventListener(
    "click",
    function () {

        audioInput.click();

    }
);


/* =========================================================
   COVER BUTTON
========================================================= */

coverButton.addEventListener(
    "click",
    function () {

        coverInput.click();

    }
);


/* =========================================================
   BOTTOM COVER BUTTON
========================================================= */

coverButtonBottom.addEventListener(
    "click",
    function () {

        coverInput.click();

    }
);


/* =========================================================
   COVER FILE
========================================================= */

coverInput.addEventListener(
    "change",
    function (event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        if (coverURL) {

            URL.revokeObjectURL(
                coverURL
            );

        }


        coverURL =
            URL.createObjectURL(file);


        const preview =
            new Image();


        preview.onload =
            function () {

                coverImage.style.opacity =
                    "0";


                setTimeout(
                    function () {

                        coverImage.src =
                            coverURL;


                        background.style.backgroundImage =
                            `
                            linear-gradient(
                                rgba(0,0,0,0.25),
                                rgba(0,0,0,0.60)
                            ),
                            url("${coverURL}")
                            `;


                        coverImage.style.opacity =
                            "1";

                    },
                    100
                );

            };


        preview.src =
            coverURL;


        coverInput.value = "";

    }
);


/* =========================================================
   EDIT ARTIST
========================================================= */

editArtist.addEventListener(
    "click",
    function () {

        const current =
            artist.textContent.trim();


        const result =
            prompt(
                "Masukkan nama artist:",
                current
            );


        if (
            result !== null &&
            result.trim() !== ""
        ) {

            artist.textContent =
                result.trim();

        }

    }
);


/* =========================================================
   MARQUEE
========================================================= */

function updateMarquee() {

    titleTrack.classList.remove(
        "scrolling"
    );


    requestAnimationFrame(
        function () {

            const textWidth =
                songTitle.offsetWidth;


            const windowWidth =
                titleWindow.clientWidth;


            if (
                textWidth >
                windowWidth
            ) {

                titleTrack.classList.add(
                    "scrolling"
                );

            }

        }
    );

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secondsPart).padStart(
            2,
            "0"
        )
    );

}


/* =========================================================
   METADATA
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    function () {

        duration.textContent =
            formatTime(
                audio.duration
            );


        updateMarquee();

    }
);


/* =========================================================
   CURRENT TIME
========================================================= */

audio.addEventListener(
    "timeupdate",
    function () {

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   VOLUME
========================================================= */

audio.volume =
    Number(
        volumeSlider.value
    );


volumeSlider.addEventListener(
    "input",
    function () {

        const value =
            Number(
                volumeSlider.value
            );


        audio.volume =
            value;


        volumeSlider.style.setProperty(
            "--volume",
            (value * 100) + "%"
        );

    }
);


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        Math.max(
            1,
            window.devicePixelRatio || 1
        );


    canvas.width =
        Math.floor(
            rect.width * ratio
        );


    canvas.height =
        Math.floor(
            rect.height * ratio
        );


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


resizeCanvas();


window.addEventListener(
    "resize",
    function () {

        resizeCanvas();

        updateMarquee();

    }
);


/* =========================================================
   GET AUDIO VALUE
========================================================= */

function getAudioValue(index) {

    if (
        !frequencyData
    ) {

        return 0;

    }


    /*
        Mapping dibuat lebih fokus
        ke bass dan mid.
    */

    const t =
        index /
        (BAR_COUNT - 1);


    const mapped =
        Math.pow(
            t,
            1.75
        );


    const position =
        Math.floor(
            mapped *
            (frequencyData.length * 0.58)
        );


    return (
        frequencyData[
            Math.min(
                position,
                frequencyData.length - 1
            )
        ] || 0
    );

}


/* =========================================================
   DRAW SMALL SPECTRUM
========================================================= */

function drawSpectrum() {

    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Ambil audio data.
    */

    if (
        analyser &&
        frequencyData
    ) {

        analyser.getByteFrequencyData(
            frequencyData
        );

    }


    /*
        Progress lagu.
    */

    let progress = 0;


    if (
        audio.duration &&
        Number.isFinite(
            audio.duration
        )
    ) {

        progress =
            audio.currentTime /
            audio.duration;

    }


    /*
        Spectrum kecil.
    */

    const gap =
        1.6;


    const totalGap =
        gap *
        (BAR_COUNT - 1);


    const barWidth =
        Math.max(
            1.5,
            (
                width -
                totalGap
            ) /
            BAR_COUNT
        );


    const center =
        height / 2;


    /*
        Tinggi maksimal dibuat kecil.
    */

    const maxHeight =
        height * 0.27;


    /* =====================================================
       UPDATE
    ====================================================== */

    for (
        let i = 0;
        i < BAR_COUNT;
        i++
    ) {

        let target = 0;


        if (
            analyser &&
            frequencyData &&
            !audio.paused
        ) {

            let value =
                getAudioValue(i) /
                255;


            /*
                Bass lebih terasa.
            */

            if (
                i <
                BAR_COUNT * 0.30
            ) {

                value *= 1.28;

            }


            /*
                Variasi agar tidak seragam.
            */

            value *=
                0.84 +
                Math.sin(i * 1.41) *
                0.10 +
                Math.sin(i * 0.47) *
                0.06;


            target =
                Math.min(
                    1,
                    value
                );

        } else {

            target =
                0.035;

        }


        /*
            Gerakan naik cepat.
        */

        if (
            target >
            bars[i]
        ) {

            bars[i] +=
                (
                    target -
                    bars[i]
                ) *
                0.46;

        } else {

            /*
                Turun lebih smooth.
            */

            bars[i] +=
                (
                    target -
                    bars[i]
                ) *
                0.12;

        }

    }


    /* =====================================================
       DRAW
    ====================================================== */

    for (
        let i = 0;
        i < BAR_COUNT;
        i++
    ) {

        const x =
            i *
            (
                barWidth +
                gap
            );


        /*
            Spectrum dibuat
            tidak terlalu tinggi.
        */

        const heightValue =
            Math.max(
                1.5,
                bars[i] *
                maxHeight
            );


        const y =
            center -
            heightValue;


        const totalHeight =
            heightValue * 2;


        /*
            Progress orange.
        */

        const position =
            i /
            (BAR_COUNT - 1);


        let orange =
            position <= progress;


        /*
            Warna.
        */

        if (orange) {

            ctx.fillStyle =
                "#ff6b20";

            ctx.shadowColor =
                "rgba(255,100,25,0.55)";

        } else {

            ctx.fillStyle =
                "rgba(255,255,255,0.82)";

            ctx.shadowColor =
                "rgba(255,255,255,0.20)";

        }


        ctx.shadowBlur = 5;


        /*
            Rounded small bars.
        */

        const radius =
            Math.min(
                barWidth / 2,
                2
            );


        drawRoundRect(
            x,
            y,
            barWidth,
            totalHeight,
            radius
        );


        ctx.fill();

    }


    ctx.shadowBlur = 0;


    requestAnimationFrame(
        drawSpectrum
    );

}


/* =========================================================
   ROUNDED RECTANGLE
========================================================= */

function drawRoundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();


    ctx.moveTo(
        x + radius,
        y
    );


    ctx.lineTo(
        x + width - radius,
        y
    );


    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    ctx.lineTo(
        x + width,
        y + height - radius
    );


    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    ctx.lineTo(
        x + radius,
        y + height
    );


    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    ctx.lineTo(
        x,
        y + radius
    );


    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    ctx.closePath();

}


/* =========================================================
   START
========================================================= */

drawSpectrum();


/* =========================================================
   KEYBOARD SPACE
========================================================= */

document.addEventListener(
    "keydown",
    async function (event) {

        if (
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ) {

            event.preventDefault();


            if (!audio.src) {

                audioInput.click();

                return;

            }


            await resumeAudio();


            if (audio.paused) {

                audio.play();

            } else {

                audio.pause();

            }

        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

window.addEventListener(
    "load",
    function () {

        resizeCanvas();

        updateMarquee();

    }
);

</script>

</body>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">

<title>iPhone Music Player</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: #fff;
}


/* =========================================================
   PLAYER
========================================================= */

.player {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #050505;

    isolation: isolate;
}


/* =========================================================
   FULL SCREEN BLUR BACKGROUND
========================================================= */

.background {
    position: absolute;

    top: -55px;
    right: -55px;
    bottom: -55px;
    left: -55px;

    z-index: -5;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    filter: blur(42px);

    transform: scale(1.12);

    transition:
        background-image 0.5s ease,
        opacity 0.4s ease;
}


.background-dark {
    position: absolute;

    inset: 0;

    z-index: -4;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.18) 0%,
            rgba(0,0,0,0.10) 30%,
            rgba(0,0,0,0.30) 62%,
            rgba(0,0,0,0.78) 100%
        );

    pointer-events: none;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding:
        max(18px, env(safe-area-inset-top))
        20px
        max(18px, env(safe-area-inset-bottom))
        20px;
}


/* =========================================================
   DYNAMIC ISLAND
========================================================= */

.dynamic-island {
    position: absolute;

    top: max(8px, env(safe-area-inset-top));

    left: 50%;

    transform: translateX(-50%);

    width: 124px;
    height: 36px;

    border-radius: 22px;

    background: #000;

    box-shadow:
        0 1px 2px rgba(0,0,0,0.7),
        inset 0 0 0 1px rgba(255,255,255,0.015);

    z-index: 50;

    transition:
        width 0.35s ease,
        height 0.35s ease,
        border-radius 0.35s ease;
}


/* camera */

.dynamic-island::after {
    content: "";

    position: absolute;

    top: 50%;
    right: 14px;

    width: 7px;
    height: 7px;

    transform: translateY(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #2d3340 0%,
            #15171b 45%,
            #050505 100%
        );

    box-shadow:
        inset 0 0 2px rgba(255,255,255,0.15);
}


/* =========================================================
   TOP BAR
========================================================= */

.top-area {
    width: 100%;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}


.top-title {
    margin-top: 8px;

    font-size: 15px;
    font-weight: 600;

    letter-spacing: -0.2px;

    opacity: 0.95;
}


/* =========================================================
   COVER AREA
========================================================= */

.cover-area {
    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding:
        10px
        0
        7px;
}


.cover-button {
    position: relative;

    border: 0;
    outline: 0;

    padding: 0;

    background: transparent;

    width: min(76vw, 365px);
    height: min(76vw, 365px);

    border-radius: 8px;

    overflow: hidden;

    cursor: pointer;

    box-shadow:
        0 28px 70px rgba(0,0,0,0.52),
        0 0 28px rgba(255,255,255,0.035);
}


.cover-image {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    user-select: none;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}


.cover-button:active .cover-image {
    transform: scale(0.975);
}


/* =========================================================
   SONG INFORMATION
========================================================= */

.song-info {
    width: 100%;

    max-width: 600px;

    flex-shrink: 0;

    padding:
        3px
        2px
        0;
}


/* =========================================================
   SEAMLESS MARQUEE
========================================================= */

.title-window {
    position: relative;

    width: 100%;

    overflow: hidden;

    white-space: nowrap;

    mask-image:
        linear-gradient(
            to right,
            transparent 0,
            #000 3%,
            #000 97%,
            transparent 100%
        );

    -webkit-mask-image:
        linear-gradient(
            to right,
            transparent 0,
            #000 3%,
            #000 97%,
            transparent 100%
        );
}


.title-track {
    display: inline-flex;

    width: max-content;

    white-space: nowrap;
}


.song-title {
    display: inline-block;

    font-size: 22px;
    line-height: 28px;

    font-weight: 700;

    letter-spacing: -0.55px;

    white-space: nowrap;
}


.song-title-copy {
    display: inline-block;

    padding-left: 55px;

    font-size: 22px;
    line-height: 28px;

    font-weight: 700;

    letter-spacing: -0.55px;

    white-space: nowrap;
}


.title-track.scrolling {
    animation:
        seamlessMarquee
        11s
        linear
        infinite;
}


@keyframes seamlessMarquee {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}


/* =========================================================
   ARTIST
========================================================= */

.artist-row {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 1px;
}


.artist-name {
    min-width: 0;
    max-width: calc(100% - 35px);

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    color:
        rgba(255,255,255,0.72);

    font-size: 16px;
    line-height: 22px;

    font-weight: 500;
}


.edit-artist {
    border: 0;
    outline: 0;

    background: transparent;

    color:
        rgba(255,255,255,0.62);

    font-size: 15px;

    cursor: pointer;

    padding: 3px 5px;
}


/* =========================================================
   SPECTRUM
========================================================= */

.spectrum-section {
    position: relative;

    width: 100%;
    max-width: 600px;

    height: 112px;

    flex-shrink: 0;

    margin-top: 8px;

    overflow: hidden;
}


.spectrum-wrapper {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* Canvas hanya spectrum */

#spectrumCanvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    pointer-events: none;
}


/* =========================================================
   PLAY BUTTON
========================================================= */

.play-button {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    width: 62px;
    height: 62px;

    border: 0;
    outline: 0;

    padding: 0;

    background: transparent;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 10;
}


.play-button:active {
    transform:
        translate(-50%, -50%)
        scale(0.90);
}


/* =========================================================
   PLAY ICON
========================================================= */

.play-icon {
    width: 0;
    height: 0;

    margin-left: 5px;

    border-top:
        12px solid transparent;

    border-bottom:
        12px solid transparent;

    border-left:
        18px solid #fff;

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,255,255,0.45)
        );
}


.play-icon.pause {
    position: relative;

    width: 18px;
    height: 23px;

    margin-left: 0;

    border: 0;

    background:
        linear-gradient(
            to right,
            #fff 0 5px,
            transparent 5px 12px,
            #fff 12px 17px
        );

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,255,255,0.45)
        );
}


/* =========================================================
   TIME
========================================================= */

.time-row {
    width: 100%;
    max-width: 600px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    flex-shrink: 0;

    margin-top: 1px;

    font-size: 11px;

    color:
        rgba(255,255,255,0.65);

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   VOLUME
========================================================= */

.volume-area {
    width: 100%;
    max-width: 600px;

    height: 38px;

    display: flex;

    align-items: center;

    gap: 10px;

    flex-shrink: 0;

    margin-top: 4px;
}


.volume-icon {
    width: 22px;
    height: 22px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;
}


.volume-icon svg {
    width: 19px;
    height: 19px;

    fill: #fff;

    opacity: 0.88;
}


.volume-slider {
    width: 100%;

    height: 4px;

    appearance: none;
    -webkit-appearance: none;

    border: 0;
    outline: 0;

    border-radius: 999px;

    background:
        linear-gradient(
            to right,
            rgba(255,255,255,0.95) 0%,
            rgba(255,255,255,0.95) var(--volume),
            rgba(255,255,255,0.22) var(--volume),
            rgba(255,255,255,0.22) 100%
        );
}


.volume-slider::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}


.volume-slider::-moz-range-thumb {
    width: 13px;
    height: 13px;

    border: 0;

    border-radius: 50%;

    background: #fff;

    cursor: pointer;
}


/* =========================================================
   BOTTOM BUTTONS
========================================================= */

.bottom-actions {
    width: 100%;
    max-width: 600px;

    height: 39px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    flex-shrink: 0;
}


.action-button {
    min-height: 32px;

    padding:
        0 14px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius: 18px;

    background:
        rgba(255,255,255,0.075);

    color: #fff;

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;
}


.action-button:active {
    transform: scale(0.96);

    background:
        rgba(255,255,255,0.14);
}


/* =========================================================
   HIDDEN FILE INPUT
========================================================= */

.hidden-input {
    display: none;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (min-width: 700px) {

    .player {
        width: min(100vw, 560px);
        height: 100vh;
    }

}


@media (max-height: 760px) {

    .top-area {
        height: 48px;
    }

    .cover-button {
        width: min(66vw, 300px);
        height: min(66vw, 300px);
    }

    .spectrum-section {
        height: 96px;
    }

    .volume-area {
        height: 34px;
    }

}


@media (max-height: 640px) {

    .dynamic-island {
        width: 112px;
        height: 31px;
    }

    .top-area {
        height: 40px;
    }

    .cover-button {
        width: min(54vw, 230px);
        height: min(54vw, 230px);
    }

    .song-title {
        font-size: 19px;
        line-height: 24px;
    }

    .song-title-copy {
        font-size: 19px;
        line-height: 24px;
    }

    .spectrum-section {
        height: 78px;
    }

    .bottom-actions {
        height: 33px;
    }

}


@media (max-height: 520px) {

    .cover-button {
        width: min(43vw, 190px);
        height: min(43vw, 190px);
    }

    .spectrum-section {
        height: 68px;
    }

    .volume-area {
        height: 28px;
    }

    .bottom-actions {
        display: none;
    }

}

</style>
</head>


<body>


<main
    class="player"
    id="player"
    style="
        --cover-image:
        url('https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1000&q=90');
    ">


    <!-- =====================================================
         FULL SCREEN BLUR
    ====================================================== -->

    <div
        class="background"
        id="background">
    </div>

    <div
        class="background-dark">
    </div>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <div class="content">


        <!-- =================================================
             DYNAMIC ISLAND
        ================================================== -->

        <div
            class="dynamic-island"
            id="dynamicIsland">
        </div>


        <!-- =================================================
             TOP
        ================================================== -->

        <div class="top-area">

            <div class="top-title">
                Music
            </div>

        </div>


        <!-- =================================================
             COVER
        ================================================== -->

        <div class="cover-area">

            <button
                class="cover-button"
                id="coverButton"
                aria-label="Ganti cover">

                <img
                    class="cover-image"
                    id="coverImage"
                    src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1000&q=90"
                    alt="Album Cover"
                    draggable="false">

            </button>

        </div>


        <!-- =================================================
             SONG INFORMATION
        ================================================== -->

        <div class="song-info">


            <div
                class="title-window"
                id="titleWindow">

                <div
                    class="title-track"
                    id="titleTrack">

                    <span
                        class="song-title"
                        id="songTitle">
                        Your Music
                    </span>

                    <span
                        class="song-title-copy"
                        id="songTitleCopy">
                        Your Music
                    </span>

                </div>

            </div>


            <div class="artist-row">

                <div
                    class="artist-name"
                    id="artistName">
                    Your Artist
                </div>


                <button
                    class="edit-artist"
                    id="editArtist"
                    aria-label="Edit artist">

                    ✎

                </button>

            </div>

        </div>


        <!-- =================================================
             SPECTRUM
        ================================================== -->

        <div class="spectrum-section">

            <div class="spectrum-wrapper">

                <canvas
                    id="spectrumCanvas">
                </canvas>


                <!-- ONLY ICON -->
                <button
                    class="play-button"
                    id="playButton"
                    aria-label="Play / Pause">

                    <div
                        class="play-icon"
                        id="playIcon">
                    </div>

                </button>

            </div>

        </div>


        <!-- =================================================
             TIME
        ================================================== -->

        <div class="time-row">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>


        <!-- =================================================
             VOLUME
        ================================================== -->

        <div class="volume-area">

            <div class="volume-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M3 9v6h4l5 4V5L7 9H3zm13.5
                        3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73
                        2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86
                        5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91
                        7-4.49 7-8.77s-2.99-7.86-7-8.77z">
                    </path>

                </svg>

            </div>


            <input
                class="volume-slider"
                id="volumeSlider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                style="--volume: 80%;">

        </div>


        <!-- =================================================
             ACTIONS
        ================================================== -->

        <div class="bottom-actions">

            <button
                class="action-button"
                id="changeAudioButton">

                Ganti Audio

            </button>


            <button
                class="action-button"
                id="changeCoverButton">

                Ganti Foto

            </button>

        </div>


    </div>


    <!-- =====================================================
         AUDIO
    ====================================================== -->

    <audio
        id="audio"
        preload="metadata">
    </audio>


    <!-- =====================================================
         FILE INPUT
    ====================================================== -->

    <input
        class="hidden-input"
        type="file"
        id="audioInput"
        accept="audio/*">


    <input
        class="hidden-input"
        type="file"
        id="coverInput"
        accept="image/*">


</main>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const player =
    document.getElementById("player");

const background =
    document.getElementById("background");

const coverButton =
    document.getElementById("coverButton");

const coverImage =
    document.getElementById("coverImage");

const audio =
    document.getElementById("audio");

const audioInput =
    document.getElementById("audioInput");

const coverInput =
    document.getElementById("coverInput");

const playButton =
    document.getElementById("playButton");

const playIcon =
    document.getElementById("playIcon");

const canvas =
    document.getElementById("spectrumCanvas");

const ctx =
    canvas.getContext("2d");

const songTitle =
    document.getElementById("songTitle");

const songTitleCopy =
    document.getElementById("songTitleCopy");

const titleTrack =
    document.getElementById("titleTrack");

const titleWindow =
    document.getElementById("titleWindow");

const artistName =
    document.getElementById("artistName");

const editArtist =
    document.getElementById("editArtist");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const volumeSlider =
    document.getElementById("volumeSlider");

const changeAudioButton =
    document.getElementById("changeAudioButton");

const changeCoverButton =
    document.getElementById("changeCoverButton");


/* =========================================================
   VARIABLES
========================================================= */

let audioURL = null;

let coverURL = null;

let audioContext = null;

let analyser = null;

let sourceNode = null;

let frequencyData = null;

let analyserReady = false;

let canvasWidth = 0;

let canvasHeight = 0;


/* =========================================================
   SPECTRUM SETTINGS
========================================================= */

const BAR_COUNT = 76;

const smoothBars =
    new Array(BAR_COUNT).fill(0);

const energyBars =
    new Array(BAR_COUNT).fill(0);

const idleBars =
    new Array(BAR_COUNT).fill(0);


/* =========================================================
   INITIAL COVER
========================================================= */

const initialCover =
    coverImage.src;


background.style.backgroundImage =
    `
    linear-gradient(
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.62)
    ),
    url("${initialCover}")
    `;


/* =========================================================
   AUDIO ANALYSER
========================================================= */

function initializeAnalyser() {

    if (analyserReady) {
        return;
    }


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContextClass) {
        return;
    }


    audioContext =
        new AudioContextClass();


    analyser =
        audioContext.createAnalyser();


    /*
        FFT 1024 membuat spectrum
        cukup detail tetapi tetap ringan.
    */

    analyser.fftSize = 1024;


    /*
        Smoothing rendah agar kick/bass
        terasa cepat.
    */

    analyser.smoothingTimeConstant = 0.42;


    frequencyData =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    sourceNode =
        audioContext.createMediaElementSource(
            audio
        );


    sourceNode.connect(analyser);

    analyser.connect(
        audioContext.destination
    );


    analyserReady = true;

}


/* =========================================================
   RESUME AUDIO CONTEXT
========================================================= */

async function resumeAudioContext() {

    initializeAnalyser();


    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {

        try {

            await audioContext.resume();

        } catch (error) {

            console.log(error);

        }

    }

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

playButton.addEventListener(
    "click",
    async function () {

        await resumeAudioContext();


        /*
            Jika belum ada audio,
            buka pemilih file.
        */

        if (!audio.src) {

            audioInput.click();

            return;

        }


        if (audio.paused) {

            try {

                await audio.play();

            } catch (error) {

                console.log(error);

            }

        } else {

            audio.pause();

        }

    }
);


/* =========================================================
   PLAY EVENT
========================================================= */

audio.addEventListener(
    "play",
    function () {

        playIcon.classList.add("pause");

    }
);


/* =========================================================
   PAUSE EVENT
========================================================= */

audio.addEventListener(
    "pause",
    function () {

        playIcon.classList.remove("pause");

    }
);


/* =========================================================
   END EVENT
========================================================= */

audio.addEventListener(
    "ended",
    function () {

        playIcon.classList.remove("pause");

    }
);


/* =========================================================
   AUDIO FILE
========================================================= */

audioInput.addEventListener(
    "change",
    function (event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        if (audioURL) {

            URL.revokeObjectURL(
                audioURL
            );

        }


        audioURL =
            URL.createObjectURL(file);


        audio.src =
            audioURL;


        audio.load();


        /*
            File name -> title
        */

        let filename =
            file.name;


        filename =
            filename.replace(
                /\.[^/.]+$/,
                ""
            );


        /*
            Underscore dan dash
            menjadi spasi.
        */

        filename =
            filename.replace(
                /[_-]+/g,
                " "
            );


        filename =
            filename.trim();


        songTitle.textContent =
            filename;


        songTitleCopy.textContent =
            filename;


        updateTitleMarquee();


        currentTime.textContent =
            "0:00";


        duration.textContent =
            "0:00";


        audioInput.value = "";


        initializeAnalyser();

    }
);


/* =========================================================
   CHANGE AUDIO BUTTON
========================================================= */

changeAudioButton.addEventListener(
    "click",
    function () {

        audioInput.click();

    }
);


/* =========================================================
   COVER CLICK
========================================================= */

coverButton.addEventListener(
    "click",
    function () {

        coverInput.click();

    }
);


/* =========================================================
   CHANGE COVER BUTTON
========================================================= */

changeCoverButton.addEventListener(
    "click",
    function () {

        coverInput.click();

    }
);


/* =========================================================
   COVER FILE
========================================================= */

coverInput.addEventListener(
    "change",
    function (event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        if (coverURL) {

            URL.revokeObjectURL(
                coverURL
            );

        }


        coverURL =
            URL.createObjectURL(file);


        setCover(
            coverURL
        );


        coverInput.value = "";

    }
);


/* =========================================================

function setCover(url) {

    coverImage.style.opacity = "0";


    const newImage =
        new Image();


    newImage.onload =
        function () {

            coverImage.src =
                url;


            player.style.setProperty(
                "--cover-image",
                `url("${url}")`
            );


            background.style.backgroundImage =
                `
                linear-gradient(
                    rgba(0,0,0,0.25),
                    rgba(0,0,0,0.62)
                ),
                url("${url}")
                `;


            coverImage.style.opacity =
                "1";

        };


    newImage.src =
        url;

}

/* =========================================================
   MARQUEE
========================================================= */

function updateTitleMarquee() {

    titleTrack.classList.remove(
        "scrolling"
    );


    /*
        Tunggu layout selesai
        sebelum mengukur teks.
    */

    requestAnimationFrame(
        function () {

            const textWidth =
                songTitle.offsetWidth;


            const windowWidth =
                titleWindow.clientWidth;


            if (
                textWidth >
                windowWidth
            ) {

                titleTrack.classList.add(
                    "scrolling"
                );

            }

        }
    );

}


window.addEventListener(
    "resize",
    function () {

        updateTitleMarquee();

        resizeCanvas();

    }
);


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsLeft =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secondsLeft).padStart(
            2,
            "0"
        )
    );

}


/* =========================================================
   METADATA
========================================================= */

audio.addEventListener(
    "loadedmetadata",

);

/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        Math.max(
            1,
            window.devicePixelRatio || 1
        );


    canvasWidth =
        rect.width;


    canvasHeight =
        rect.height;


    canvas.width =
        Math.floor(
            rect.width * ratio
        );


    canvas.height =
        Math.floor(
            rect.height * ratio
        );


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


resizeCanvas();


/* =========================================================
   FREQUENCY MAPPING
========================================================= */

function getFrequency(index) {

    if (
        !frequencyData
    ) {

        return 0;

    }


    /*
        Lebih banyak sensitivitas
        diberikan kepada bass.
    */

    const normalized =
        index /
        (BAR_COUNT - 1);


    let position;


    if (
        normalized <
        0.35
    ) {

        /*
            Bagian kiri spectrum
            lebih sensitif terhadap
            kick/bass.
        */

        position =
            normalized /
            0.35;


        position =
            Math.pow(
                position,
                1.7
            );


        position *= 0.22;

    } else {

        position =
            (normalized - 0.35) /
            0.65;


        position =
            0.22 +
            Math.pow(
                position,
                1.35
            ) *
            0.78;

    }


    const dataIndex =
        Math.floor(
            position *
            (frequencyData.length - 1)
        );


    return (
        frequencyData[
            Math.min(
                dataIndex,
                frequencyData.length - 1
            )
        ] || 0
    );

}


/* =========================================================
   DRAW SPECTRUM
========================================================= */

function drawSpectrum() {

    const now =
        performance.now();


    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );


    /*
        Ambil data audio.
    */

    if (
        analyser &&
        frequencyData
    ) {

        analyser.getByteFrequencyData(
            frequencyData
        );

    }


    /*
        Progress lagu.
    */

    let progress = 0;


    if (
        audio.duration &&
        Number.isFinite(
            audio.duration
        )
    ) {

        progress =
            audio.currentTime /
            audio.duration;

    }


    /*
        Geometry.
    */

    const gap =
        Math.max(
            1.2,
            canvasWidth /
            BAR_COUNT *
            0.16
        );


    const barWidth =
        (
            canvasWidth -
            gap *
            (BAR_COUNT - 1)
        ) /
        BAR_COUNT;


    const centerY =
        canvasHeight / 2;


    const maxHeight =
        canvasHeight * 0.43;


    /* =====================================================
       UPDATE BARS
    ====================================================== */

    for (
        let i = 0;
        i < BAR_COUNT;
        i++
    ) {

        let target;


        if (
            analyser &&
            frequencyData &&
            !audio.paused
        ) {

            let value =
                getFrequency(i) /
                255;


            /*
                Boost bass.
            */

            if (
                i <
                BAR_COUNT * 0.32
            ) {

                value *= 1.35;

            }


            /*
                Variasi abstrak.
            */

            const variation =
                0.86 +
                Math.sin(
                    i * 1.73
                ) *
                0.09 +
                Math.sin(
                    i * 0.41
                ) *
                0.07;


            value *=
                variation;


            /*
                Kick multiplier.
            */

            const bassBoost =
                i <
                BAR_COUNT * 0.25
                    ? 1.12
                    : 1;


            value *=
                bassBoost;


            target =
                Math.min(
                    1,
                    value
                );


            /*
                Sedikit minimum movement.
            */

            if (
                target < 0.015
            ) {

                target =
                    0.015 +
                    Math.random() *
                    0.018;

            }

        } else {

            /*
                Saat pause,
                spectrum tetap memiliki
                sedikit bentuk.
            */

            target =
                0.035 +
                Math.sin(
                    now * 0.0012 +
                    i * 0.65
                ) *
                0.012;

        }


        /*
            Attack cepat,
            release sedikit lebih smooth.
        */

        const attack =
            0.38;


        const release =
            0.13;


        const speed =
            target >
            smoothBars[i]
                ? attack
                : release;


        smoothBars[i] +=
            (
                target -
                smoothBars[i]
            ) *
            speed;


        /*
            Sedikit idle animation
            untuk membuat spectrum
            tidak mati total.
        */

        idleBars[i] =
            Math.sin(
                now * 0.0017 +
                i * 0.54
            );


        energyBars[i] =
            smoothBars[i];

    }


    /* =====================================================
       DRAW GLOW
    ====================================================== */

    ctx.save();

    ctx.shadowBlur = 8;

    ctx.shadowColor =
        "rgba(255,104,24,0.45)";


    /* =====================================================
       DRAW EVERY BAR
    ====================================================== */

    for (
        let i = 0;
        i < BAR_COUNT;
        i++
    ) {

        const x =
            i *
            (
                barWidth +
                gap
            );


        /*
            Abstrak.
        */

        const shape =
            0.74 +
            Math.sin(
                i * 1.41
            ) *
            0.13 +
            Math.sin(
                i * 0.37
            ) *
            0.10;


        let barHeight =
            energyBars[i] *
            maxHeight *
            shape;


        /*
            Gerakan tambahan sangat kecil.
        */

        barHeight *=
            1 +
            idleBars[i] *
            0.035;


        /*
            Jangan terlalu kecil.
        */

        if (
            !audio.paused &&
            barHeight < 2
        ) {

            barHeight = 2;

        }


        const height =
            Math.max(
                2,
                barHeight * 2
            );


        const y =
            centerY -
            barHeight;


        /*
            Progress warna orange.
        */

        const position =
            i /
            (BAR_COUNT - 1);


        const played =
            position <= progress;


        /*
            Smooth transition warna
            berdasarkan jarak progress.
        */

        const edge =
            0.035;


        let orangeAmount;


        if (
            position <
            progress - edge
        ) {

            orangeAmount = 1;

        } else if (
            position >
            progress + edge
        ) {

            orangeAmount = 0;

        } else {

            orangeAmount =
                1 -
                (
                    (position - progress + edge) /
                    (edge * 2)
                );

        }


        orangeAmount =
            Math.max(
                0,
                Math.min(
                    1,
                    orangeAmount
                )
            );


        /*
            Warna normal.
        */

        const normalR = 255;
        const normalG = 255;
        const normalB = 255;


        /*
            Warna orange.
        */

        const orangeR = 255;
        const orangeG = 112;
        const orangeB = 30;


        const r =
            Math.round(
                normalR +
                (
                    orangeR -
                    normalR
                ) *
                orangeAmount
            );


        const g =
            Math.round(
                normalG +
                (
                    orangeG -
                    normalG
                ) *
                orangeAmount
            );


        const b =
            Math.round(
                normalB +
                (
                    orangeB -
                    normalB
                ) *
                orangeAmount
            );


        ctx.fillStyle =
            `rgb(${r},${g},${b})`;


        ctx.shadowColor =
            orangeAmount > 0.2
                ? "rgba(255,95,20,0.60)"
                : "rgba(255,255,255,0.18)";


        /*
            Rounded bars.
        */

        const radius =
            Math.min(
                barWidth / 2,
                3.5
            );


        drawRoundedRect(
            ctx,
            x,
            y,
            barWidth,
            height,
            radius
        );


        ctx.fill();

    }


    ctx.restore();


    requestAnimationFrame(
        drawSpectrum
    );

}


/* =========================================================
   ROUNDED RECT
========================================================= */

function drawRoundedRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    radius =
        Math.min(
            radius,
            width / 2,
            height / 2
        );


    context.beginPath();


    context.moveTo(
        x + radius,
        y
    );


    context.lineTo(
        x + width - radius,
        y
    );


    context.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    context.lineTo(
        x + width,
        y + height - radius
    );


    context.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    context.lineTo(
        x + radius,
        y + height
    );


    context.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    context.lineTo(
        x,
        y + radius
    );


    context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    context.closePath();

}


/* =========================================================
   START SPECTRUM
========================================================= */

drawSpectrum();


/* =========================================================
   KEYBOARD SPACE
========================================================= */

document.addEventListener(
    "keydown",
    async function (event) {

        if (
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ) {

            event.preventDefault();


            await resumeAudioContext();


            if (!audio.src) {

                audioInput.click();

                return;

            }


            if (audio.paused) {

                audio.play();

            } else {

                audio.pause();

            }

        }

    }
);

   PREVENT IMAGE CONTEXT MENU
========================================================= */

coverImage.addEventListener(

        event.preventDefault();

    }
);

   INITIAL MARQUEE CHECK
========================================================= */

window.addEventListener(

        updateTitleMarquee();

    }
);

</script>

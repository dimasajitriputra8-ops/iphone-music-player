<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<meta name="theme-color" content="#071b29" />

<title>DERBAYS Music Player</title>

<style>
/* =========================================================
   DERBAYS MUSIC PLAYER
   Single-file HTML
   ========================================================= */

:root {
  --accent: #dce8ef;
  --accent-strong: #ffffff;
  --text: #ffffff;
  --text-soft: rgba(255, 255, 255, 0.66);
  --text-dim: rgba(255, 255, 255, 0.42);

  --glass: rgba(18, 26, 33, 0.42);
  --glass-strong: rgba(12, 19, 25, 0.62);

  --player-width: 760px;
  --player-radius: 46px;

  --dynamic-width: 176px;
  --dynamic-height: 42px;

  --transition-fast: 180ms cubic-bezier(.2,.8,.2,1);
  --transition-normal: 380ms cubic-bezier(.2,.8,.2,1);
  --transition-slow: 650ms cubic-bezier(.16,1,.3,1);
}

/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100svh;
  overflow-x: hidden;

  background: #071b29;
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.background {
  position: fixed;
  inset: -80px;

  z-index: 0;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #153d53,
      #082536 45%,
      #061722
    );
}

.background-art {
  position: absolute;
  inset: -70px;

  width: calc(100% + 140px);
  height: calc(100% + 140px);

  object-fit: cover;

  filter:
    blur(58px)
    saturate(1.15)
    brightness(0.58);

  transform: scale(1.12);

  opacity: 0.94;

  transition:
    opacity 500ms ease,
    transform 800ms cubic-bezier(.16,1,.3,1),
    filter 800ms ease;
}

.background-overlay {
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(255,255,255,0.08),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      rgba(5,15,22,0.18),
      rgba(4,13,20,0.54)
    );

  pointer-events: none;
}

.background-noise {
  position: absolute;
  inset: 0;

  opacity: 0.07;

  pointer-events: none;

  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

  mix-blend-mode: overlay;
}

/* =========================================================
   APP
   ========================================================= */

.app {
  position: relative;
  z-index: 2;

  min-height: 100svh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding:
    max(90px, env(safe-area-inset-top))
    20px
    max(28px, env(safe-area-inset-bottom));
}

/* =========================================================
   PLAYER
   ========================================================= */

.player {
  position: relative;

  width: min(100%, var(--player-width));

  min-height: 680px;

  padding:
    34px
    44px
    30px;

  border:
    1px solid rgba(255,255,255,0.24);

  border-radius: var(--player-radius);

  background:
    linear-gradient(
      180deg,
      rgba(42,52,60,0.74),
      rgba(7,23,33,0.78)
    );

  box-shadow:
    0 40px 100px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.11);

  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);

  overflow: visible;
}

.player::before {
  content: "";

  position: absolute;
  inset: 0;

  border-radius: inherit;

  pointer-events: none;

  background:
    linear-gradient(
      130deg,
      rgba(255,255,255,0.08),
      transparent 32%
    );
}

/* =========================================================
   DYNAMIC ISLAND
   ========================================================= */

.dynamic-island-wrap {
  position: fixed;

  top:
    max(18px, env(safe-area-inset-top));

  left: 50%;

  transform: translateX(-50%);

  z-index: 1000;

  pointer-events: none;
}

.dynamic-island {
  position: relative;

  width: var(--dynamic-width);
  height: var(--dynamic-height);

  border-radius: 999px;

  background:
    linear-gradient(
      180deg,
      #050505,
      #000000
    );

  box-shadow:
    0 12px 36px rgba(0,0,0,0.28),
    inset 0 1px 0 rgba(255,255,255,0.05);

  overflow: hidden;

  cursor: pointer;

  pointer-events: auto;

  transition:
    width var(--transition-slow),
    height var(--transition-slow),
    border-radius var(--transition-slow),
    box-shadow var(--transition-slow);
}

.dynamic-island.expanded {
  width: min(390px, calc(100vw - 32px));
  height: 88px;

  border-radius: 28px;

  box-shadow:
    0 24px 70px rgba(0,0,0,0.42),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.island-mini {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;

  padding: 7px 13px;

  gap: 10px;

  transition:
    opacity var(--transition-fast),
    transform var(--transition-fast);
}

.dynamic-island.expanded .island-mini {
  opacity: 0;
  transform: scale(0.86);
  pointer-events: none;
}

.island-thumb {
  width: 29px;
  height: 29px;

  border-radius: 8px;

  object-fit: cover;

  flex: 0 0 auto;

  background: #202020;
}

.island-mini-info {
  min-width: 0;
  flex: 1;
}

.island-mini-title {
  font-size: 11px;
  font-weight: 650;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  color: #fff;
}

.island-mini-artist {
  margin-top: 2px;

  font-size: 9px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  color: rgba(255,255,255,0.52);
}

.island-spectrum {
  width: 31px;
  height: 21px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 2px;

  flex: 0 0 auto;
}

.island-spectrum span {
  width: 2px;
  height: 7px;

  border-radius: 999px;

  background: rgba(255,255,255,0.85);

  transform-origin: center;

  transition: height 70ms linear;
}

.island-spectrum span:nth-child(1) { height: 5px; }
.island-spectrum span:nth-child(2) { height: 11px; }
.island-spectrum span:nth-child(3) { height: 15px; }
.island-spectrum span:nth-child(4) { height: 8px; }
.island-spectrum span:nth-child(5) { height: 12px; }

.island-expanded {
  position: absolute;
  inset: 0;

  display: grid;

  grid-template-columns: 46px 1fr auto;

  align-items: center;

  gap: 11px;

  padding: 12px 14px;

  opacity: 0;
  transform: scale(0.92);

  pointer-events: none;

  transition:
    opacity var(--transition-normal),
    transform var(--transition-normal);
}

.dynamic-island.expanded .island-expanded {
  opacity: 1;
  transform: scale(1);

  pointer-events: auto;
}

.island-expanded-art {
  width: 46px;
  height: 46px;

  border-radius: 13px;

  object-fit: cover;

  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

.island-expanded-info {
  min-width: 0;
}

.island-expanded-title {
  font-size: 13px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.island-expanded-artist {
  margin-top: 3px;

  font-size: 11px;

  color: rgba(255,255,255,0.52);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.island-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.island-action {
  width: 31px;
  height: 31px;

  display: grid;
  place-items: center;

  border: 0;
  border-radius: 50%;

  color: #fff;

  background: rgba(255,255,255,0.08);

  cursor: pointer;

  transition:
    transform var(--transition-fast),
    background var(--transition-fast);
}

.island-action:hover {
  background: rgba(255,255,255,0.16);
}

.island-action:active {
  transform: scale(0.88);
}

.island-action svg {
  width: 15px;
  height: 15px;
}

/* =========================================================
   TOP ROW
   ========================================================= */

.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  min-height: 38px;

  margin-bottom: 18px;
}

.player-label {
  font-size: 12px;

  color: rgba(255,255,255,0.42);

  letter-spacing: 0.04em;

  text-transform: uppercase;
}

.top-actions {
  display: none;
}

.top-button {
  width: 35px;
  height: 35px;

  border: 1px solid rgba(255,255,255,0.08);

  border-radius: 50%;

  background: rgba(255,255,255,0.05);

  color: rgba(255,255,255,0.75);

  display: grid;
  place-items: center;

  cursor: pointer;

  transition:
    background var(--transition-fast),
    transform var(--transition-fast);
}

.top-button:hover {
  background: rgba(255,255,255,0.11);
}

.top-button:active {
  transform: scale(0.9);
}

.top-button svg {
  width: 16px;
  height: 16px;
}

/* =========================================================
   ARTWORK
   ========================================================= */

.artwork-section {
  width: 100%;

  display: flex;
  justify-content: center;

  margin-top: 6px;
}

.artwork {
  position: relative;
  cursor: pointer;
  touch-action: manipulation;

  width: min(100%, 570px);

  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 25px;

  background: #202a31;

  box-shadow:
    0 30px 60px rgba(0,0,0,0.32),
    0 2px 5px rgba(0,0,0,0.25);

  cursor: pointer;

  transform: translateZ(0);

  transition:
    transform 500ms cubic-bezier(.16,1,.3,1),
    box-shadow 500ms ease;
}

.artwork:hover {
  transform: scale(1.006);
}

.artwork:active {
  transform: scale(0.985);
}

.artwork-image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  /*
    Screenshot kamu berukuran 864 x 1536.
    Bagian artwork berada di sekitar tengah atas.
    object-position 41% membantu mengambil bagian artwork.
  */

  object-position: center 41%;

  user-select: none;
  -webkit-user-drag: none;
}

.artwork::after {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  border-radius: inherit;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.artwork-hint {
  position: absolute;

  left: 50%;
  bottom: 18px;

  transform: translate(-50%, 10px);

  padding: 8px 13px;

  border-radius: 999px;

  background: rgba(0,0,0,0.45);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  font-size: 10px;
  font-weight: 600;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity var(--transition-fast),
    transform var(--transition-fast);

  white-space: nowrap;
}

.artwork:hover .artwork-hint {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* =========================================================
   TRACK INFO
   ========================================================= */

.track-info {
  margin-top: 27px;

  text-align: left;
}

.track-title-row {
  display: flex;
  align-items: center;

  min-width: 0;
}

.track-title {
  min-width: 0;
  flex: 1 1 auto;

  font-size: clamp(22px, 4vw, 32px);
  line-height: 1.08;
  font-weight: 750;
  letter-spacing: -0.035em;

  white-space: nowrap;
  overflow: hidden;
  position: relative;
  /* Feather halus di kedua tepi agar teks masuk/keluar tanpa terpotong kasar. */
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 5.5%, #000 94.5%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 5.5%, #000 94.5%, transparent 100%);
}

.track-title-marquee {
  display: inline-block;
  white-space: nowrap;
  will-change: transform, opacity;
  /* Glow tipis sebagai aksen, tetap lembut dan tidak berlebihan. */
  text-shadow: 0 0 5px rgba(255, 255, 255, 0.16), 0 0 10px rgba(160, 195, 255, 0.08);
}

.track-title.marquee-active .track-title-marquee {
  animation: derbaysTitleMarquee var(--marquee-duration, 8s) linear infinite;
}

@keyframes derbaysTitleMarquee {
  /* Diam sebentar di awal, lalu berjalan ke kiri. */
  0%, 8% { transform: translateX(0); opacity: 1; }
  /* Berjalan perlahan agar judul panjang tetap mudah dibaca. */
  62% { transform: translateX(calc(-1 * var(--marquee-distance, 0px))); opacity: 1; }
  /* Jeda di ujung sebelum kembali ke awal. */
  70%, 74% { transform: translateX(calc(-1 * var(--marquee-distance, 0px))); opacity: 1; }
  /* Kedip lembut beberapa kali, seperti transisi halus pada pemutar musik. */
  77% { opacity: .35; }
  80% { opacity: 1; }
  83% { opacity: .35; }
  86% { opacity: 1; }
  89% { opacity: .35; }
  92% { opacity: 1; }
  /* Sembunyikan sesaat saat posisi kembali ke awal agar reset tidak terasa menyentak. */
  95% { transform: translateX(calc(-1 * var(--marquee-distance, 0px))); opacity: 0; }
  96% { transform: translateX(0); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .track-title.marquee-active .track-title-marquee { animation: none; }
}

.explicit {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  margin-left: 8px;

  width: 20px;
  height: 20px;

  border: 1px solid rgba(255,255,255,0.62);

  border-radius: 5px;

  font-size: 10px;
  font-weight: 800;

  flex: 0 0 auto;

  opacity: 0.9;
}

.artist-button {
  display: inline-block;

  margin-top: 8px;

  padding: 0;

  border: 0;

  color: rgba(255,255,255,0.57);

  background: transparent;

  font: inherit;

  font-size: clamp(15px, 2vw, 18px);

  cursor: pointer;

  transition:
    color var(--transition-fast);
}

.artist-button:hover {
  color: #fff;
}

/* =========================================================
   MINI SPECTRUM - APPLE STYLE
   ========================================================= */

.progress-header {
  position: relative;

  width: 100%;
  height: 17px;

  display: flex;

  justify-content: flex-end;
  align-items: flex-end;

  margin-bottom: 4px;
}

.spectrum-mini {
  width: 32px;
  height: 16px;

  display: flex;

  align-items: flex-end;
  justify-content: flex-end;

  gap: 2px;

  opacity: 0.78;

  overflow: hidden;
}

.spectrum-mini span {
  display: block;

  width: 2px;

  min-height: 3px;

  max-height: 14px;

  border-radius: 999px;

  background: rgba(255,255,255,0.88);

  transform-origin: bottom center;

  transition:
    height 70ms linear,
    opacity 120ms ease;
}

.spectrum-mini span:nth-child(1) {
  height: 5px;
}

.spectrum-mini span:nth-child(2) {
  height: 9px;
}

.spectrum-mini span:nth-child(3) {
  height: 13px;
}

.spectrum-mini span:nth-child(4) {
  height: 7px;
}

.spectrum-mini span:nth-child(5) {
  height: 11px;
}

.spectrum-mini span:nth-child(6) {
  height: 6px;
}

.spectrum-mini span:nth-child(7) {
  height: 9px;
}

/* =========================================================
   PROGRESS
   ========================================================= */

.progress-section {
  margin-top: 6px;
  width: calc(100% + 24px);
  margin-left: -12px;
  margin-right: -12px;
}

.progress-track {
  position: relative;

  width: 100%;
  height: 6px;

  border-radius: 999px;

  background: rgba(255,255,255,0.20);

  cursor: pointer;

  touch-action: none;
}

.progress-fill {
  position: absolute;

  top: 0;
  left: 0;

  width: 0%;
  height: 100%;

  border-radius: inherit;

  background: rgba(255,255,255,0.86);

  /* Pergerakan utama digerakkan requestAnimationFrame agar tidak tersendat. */
  transition: none;
  pointer-events: none;
}

.progress-thumb {
  position: absolute;

  top: 50%;

  left: 0%;

  width: 13px;
  height: 13px;

  border-radius: 50%;

  background: #fff;

  transform:
    translate(-50%, -50%)
    scale(0);

  box-shadow:
    0 1px 5px rgba(0,0,0,0.25);

  transition: transform 180ms cubic-bezier(.2,.8,.2,1);

  pointer-events: none;
}

.progress-track:hover .progress-thumb,
.progress-track.dragging .progress-thumb {
  transform: translate(-50%, -50%) scale(1);
}

.time-row {
  display: flex;

  justify-content: space-between;

  margin-top: 8px;

  color: rgba(255,255,255,0.58);

  font-size: 12px;

  font-variant-numeric: tabular-nums;
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: clamp(38px, 8vw, 72px);

  margin-top: 25px;
}

.control {
  width: 45px;
  height: 45px;

  border: 0;

  border-radius: 50%;

  background: transparent;

  color: #fff;

  display: grid;
  place-items: center;

  cursor: pointer;

  transition:
    transform var(--transition-fast),
    opacity var(--transition-fast);
}

.control:hover {
  transform: scale(1.07);
}

.control:active {
  transform: scale(0.86);
}

.control svg {
  width: 31px;
  height: 31px;

  fill: currentColor;
}

.control.play {
  width: 72px;
  height: 72px;

  background: transparent;

  color: #ffffff;

  box-shadow: none;

  transition:
    transform var(--transition-fast),
    background var(--transition-fast);
}

.control.play:hover {
  background: transparent;

  transform: scale(1.05);
}

.control.play svg {
  width: 49px;
  height: 49px;
  transform-origin: center;
  transition: transform 460ms cubic-bezier(.2,.8,.2,1);
}

.control.play.is-press-anim {
  animation: playPressRelease 460ms cubic-bezier(.2,.8,.2,1);
}

@keyframes playPressRelease {
  0% { transform: scale(1); }
  24% { transform: scale(0.76); }
  58% { transform: scale(1.14); }
  78% { transform: scale(0.97); }
  100% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .control.play.is-press-anim { animation-duration: 1ms; }
  .progress-fill, .progress-thumb { transition-duration: 1ms; }
  .control.play svg { transition-duration: 1ms; }
}

/* =========================================================
   VOLUME
   ========================================================= */

.volume-section {
  display: flex;

  align-items: center;

  gap: 13px;

  margin-top: 26px;
}

.volume-icon {
  width: 20px;
  height: 20px;

  color: rgba(255,255,255,0.55);

  flex: 0 0 auto;
}

.volume-track {
  position: relative;

  flex: 1;

  height: 7px;

  border-radius: 999px;

  background: rgba(255,255,255,0.22);

  cursor: pointer;

  touch-action: none;
}

.volume-fill {
  position: absolute;

  top: 0;
  left: 0;

  height: 100%;

  width: 78%;

  border-radius: inherit;

  background: rgba(255,255,255,0.74);
}

.volume-thumb {
  position: absolute;

  top: 50%;
  left: 78%;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: #fff;

  transform: translate(-50%, -50%);

  opacity: 0;

  transition: opacity var(--transition-fast);
}

.volume-track:hover .volume-thumb,
.volume-track.dragging .volume-thumb {
  opacity: 1;
}

/* =========================================================
   DERBAYS OUTPUT
   ========================================================= */

.output-button {
  margin: 25px auto 0;

  min-width: 150px;
  height: 54px;

  padding: 0 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 10px;

  border: 0;

  border-radius: 999px;

  color: rgba(255,255,255,0.86);

  background:
    rgba(255,255,255,0.10);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  cursor: pointer;

  font-size: 14px;
  font-weight: 600;

  letter-spacing: 0.01em;

  transition:
    background var(--transition-fast),
    transform var(--transition-fast);
}

.output-button:hover {
  background: rgba(255,255,255,0.15);
}

.output-button:active {
  transform: scale(0.97);
}

.output-icon {
  width: 23px;
  height: 23px;

  display: grid;
  p

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>iPhone Music Player</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  color: white;
}

/* =====================================================
   BACKGROUND
===================================================== */

.player {
  position: relative;
  width: 100vw;
  height: 100dvh;
  min-height: 100vh;
  overflow: hidden;
  background: #080808;
}

.background {
  position: absolute;
  inset: -50px;

  background-image:
    linear-gradient(
      rgba(0, 0, 0, .18),
      rgba(0, 0, 0, .55)
    ),
    url("");

  background-position: center;
  background-size: cover;

  filter: blur(45px);
  transform: scale(1.15);

  opacity: .9;

  transition:
    background-image .5s ease,
    opacity .5s ease;
}

.background::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 35%,
      rgba(0,0,0,.55)
    );
}

/* =====================================================
   CONTENT
===================================================== */

.content {
  position: relative;
  z-index: 2;

  width: min(100%, 500px);
  height: 100%;

  margin: auto;

  padding:
    max(24px, env(safe-area-inset-top))
    24px
    max(20px, env(safe-area-inset-bottom));

  display: flex;
  flex-direction: column;
}

/* =====================================================
   TOP
===================================================== */

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  height: 48px;
  flex-shrink: 0;
}

.top-title {
  text-align: center;
  flex: 1;

  font-size: 13px;
  font-weight: 600;

  color: rgba(255,255,255,.92);

  letter-spacing: .2px;
}

.top-button {
  width: 38px;
  height: 38px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.12);
  backdrop-filter: blur(15px);

  color: white;

  font-size: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition: .2s;
}

.top-button:active {
  transform: scale(.9);
}

/* =====================================================
   COVER
===================================================== */

.cover-area {
  width: 100%;

  display: flex;
  justify-content: center;

  margin-top: 18px;
}

.cover-button {
  width: min(82vw, 360px);
  aspect-ratio: 1 / 1;

  border: 0;
  padding: 0;

  background: transparent;

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 25px 70px rgba(0,0,0,.55);

  cursor: pointer;

  position: relative;
}

.cover {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transition: transform .35s ease;
}

.cover-button:active .cover {
  transform: scale(.97);
}

/* =====================================================
   SONG INFORMATION
===================================================== */

.song-info {
  margin-top: 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.song-text {
  min-width: 0;
  flex: 1;

  overflow: hidden;
}

.song-title {
  font-size: 22px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
}

.artist {
  margin-top: 4px;

  font-size: 16px;
  font-weight: 400;

  color: rgba(255,255,255,.68);

  white-space: nowrap;
  overflow: hidden;
}

/* =====================================================
   MARQUEE
===================================================== */

.marquee {
  display: inline-block;

  white-space: nowrap;

  animation: marquee 9s linear infinite;

  padding-right: 70px;
}

@keyframes marquee {

  0% {
    transform: translateX(0);
  }

  15% {
    transform: translateX(0);
  }

  85% {
    transform: translateX(
      calc(-100% + 280px)
    );
  }

  100% {
    transform: translateX(
      calc(-100% + 280px)
    );
  }
}

/* =====================================================
   SPECTRUM
===================================================== */

.spectrum-wrapper {
  position: relative;

  width: 100%;

  margin-top: 16px;

  height: 100px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.spectrum-box {
  position: relative;

  width: 100%;
  height: 82px;

  border: 1px solid rgba(255,255,255,.15);

  border-radius: 8px;

  overflow: hidden;

  background:
    rgba(0,0,0,.18);

  box-shadow:
    inset 0 0 30px rgba(255,255,255,.03);
}

#visualizer {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;
}

/* Progress layer */

.progress-spectrum {
  position: absolute;

  left: 0;
  top: 0;

  height: 100%;

  width: 0%;

  overflow: hidden;

  pointer-events: none;

  transition: width .08s linear;
}

.progress-spectrum::after {
  content: "";

  position: absolute;

  right: -5px;
  top: 0;

  width: 10px;
  height: 100%;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(255,150,40,.85)
    );

  filter: blur(5px);
}

/* =====================================================
   PLAY BUTTON
===================================================== */

.play-button {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: 48px;
  height: 48px;

  border: 0;

  background: transparent;

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 5;

  filter:
    drop-shadow(0 2px 5px rgba(0,0,0,.55));

  transition:
    transform .15s ease;
}

.play-button:active {
  transform:
    translate(-50%, -50%)
    scale(.85);
}

.play-icon {
  width: 0;
  height: 0;

  border-top: 11px solid transparent;
  border-bottom: 11px solid transparent;
  border-left: 17px solid white;

  margin-left: 4px;
}

.pause-icon {
  width: 17px;
  height: 22px;

  border-left: 6px solid white;
  border-right: 6px solid white;
}

/* =====================================================
   CONTROLS
===================================================== */

.controls {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-top: 10px;
}

.skip-button {
  width: 60px;
  height: 48px;

  border: 0;
  background: transparent;

  color: white;

  font-size: 25px;

  cursor: pointer;

  transition: transform .15s;
}

.skip-button:active {
  transform: scale(.8);
}

.time {
  font-size: 12px;

  color: rgba(255,255,255,.6);

  font-variant-numeric: tabular-nums;
}

/* =====================================================
   VOLUME
===================================================== */

.volume-area {
  margin-top: 10px;

  display: flex;
  align-items: center;

  gap: 10px;
}

.volume-icon {
  font-size: 15px;

  color: rgba(255,255,255,.7);

  width: 20px;

  text-align: center;
}

.volume-slider {
  flex: 1;

  height: 4px;

  appearance: none;
  -webkit-appearance: none;

  border-radius: 10px;

  background:
    rgba(255,255,255,.25);

  outline: none;
}

.volume-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;

  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 1px 4px rgba(0,0,0,.5);
}

.volume-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;

  border-radius: 50%;

  border: none;

  background: white;
}

/* =====================================================
   BOTTOM
===================================================== */

.bottom {
  margin-top: auto;

  padding-top: 15px;
}

.bottom-buttons {
  display: flex;

  justify-content: center;

  gap: 12px;
}

.action-button {
  height: 38px;

  padding: 0 15px;

  border: 0;

  border-radius: 20px;

  background:
    rgba(255,255,255,.10);

  color: rgba(255,255,255,.9);

  backdrop-filter: blur(12px);

  font-size: 12px;

  cursor: pointer;

  transition: .2s;
}

.action-button:active {
  transform: scale(.92);
}

/* =====================================================
   FILE INPUT
===================================================== */

.hidden-input {
  display: none;
}

/* =====================================================
   EDIT PANEL
===================================================== */

.panel {
  position: fixed;

  z-index: 20;

  left: 50%;
  bottom: 0;

  transform:
    translate(-50%, 110%);

  width: min(100%, 500px);

  padding:
    20px
    22px
    calc(20px + env(safe-area-inset-bottom));

  background:
    rgba(25,25,25,.96);

  backdrop-filter: blur(30px);

  border-radius:
    24px
    24px
    0
    0;

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1);
}

.panel.show {
  transform:
    translate(-50%, 0);
}

.panel h2 {
  font-size: 18px;

  margin-bottom: 15px;
}

.field {
  margin-bottom: 12px;
}

.field label {
  display: block;

  font-size: 12px;

  color: rgba(255,255,255,.55);

  margin-bottom: 6px;
}

.field input {
  width: 100%;

  height: 44px;

  border: 1px solid rgba(255,255,255,.12);

  border-radius: 12px;

  outline: none;

  background:
    rgba(255,255,255,.08);

  color: white;

  padding: 0 13px;

  font-size: 14px;
}

.panel-buttons {
  display: flex;

  gap: 10px;

  margin-top: 16px;
}

.panel-buttons button {
  flex: 1;

  height: 44px;

  border: 0;

  border-radius: 12px;

  background:
    rgba(255,255,255,.1);

  color: white;

  font-weight: 600;
}

.panel-buttons .save {
  background: white;
  color: black;
}

/* =====================================================
   SMALL SCREEN
===================================================== */

@media (max-height: 700px) {

  .cover-button {
    width: min(65vw, 285px);
  }

  .cover-area {
    margin-top: 8px;
  }

  .song-info {
    margin-top: 12px;
  }

  .spectrum-wrapper {
    margin-top: 8px;
  }

  .spectrum-box {
    height: 72px;
  }
}

/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) {

  .content {
    width: min(100%, 500px);
  }

}
</style>
</head>

<body>

<div class="player">

  <div class="background" id="background"></div>

  <main class="content">

    <!-- TOP -->
    <header class="top">

      <button
        class="top-button"
        id="editButton"
        aria-label="Edit music">
        ⋯
      </button>

      <div class="top-title">
        NOW PLAYING
      </div>

      <button
        class="top-button"
        id="musicButton"
        aria-label="Choose music">
        ♫
      </button>

    </header>


    <!-- COVER -->
    <section class="cover-area">

      <button
        class="cover-button"
        id="coverButton"
        aria-label="Change cover">

        <img
          id="cover"
          class="cover"
          alt="Album Cover">

      </button>

    </section>


    <!-- SONG INFO -->
    <section class="song-info">

      <div class="song-text">

        <div
          id="songTitle"
          class="song-title">
          My Music
        </div>

        <div
          id="artist"
          class="artist">
          Unknown Artist
        </div>

      </div>

    </section>


    <!-- SPECTRUM -->
    <section class="spectrum-wrapper">

      <div class="spectrum-box">

        <canvas id="visualizer"></canvas>

        <div
          id="progressSpectrum"
          class="progress-spectrum">
        </div>

      </div>

      <button
        id="playButton"
        class="play-button"
        aria-label="Play">

        <span
          id="playIcon"
          class="play-icon">
        </span>

      </button>

    </section>


    <!-- CONTROLS -->
    <section class="controls">

      <button
        id="prevButton"
        class="skip-button"
        aria-label="Previous">
        ⏮
      </button>

      <div
        id="time"
        class="time">
        0:00 / 0:00
      </div>

      <button
        id="nextButton"
        class="skip-button"
        aria-label="Next">
        ⏭
      </button>

    </section>


    <!-- VOLUME -->
    <section class="volume-area">

      <span
        id="volumeIcon"
        class="volume-icon">
        🔊
      </span>

      <input
        id="volume"
        class="volume-slider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1">

    </section>


    <!-- BOTTOM -->
    <section class="bottom">

      <div class="bottom-buttons">

        <button
          id="changeAudio"
          class="action-button">
          Ganti Audio
        </button>

        <button
          id="changeCover"
          class="action-button">
          Ganti Cover
        </button>

      </div>

    </section>

  </main>


  <!-- EDIT PANEL -->

  <section
    id="panel"
    class="panel">

    <h2>Edit Music</h2>

    <div class="field">

      <label for="titleInput">
        Judul
      </label>

      <input
        id="titleInput"
        type="text"
        placeholder="Judul musik">

    </div>

    <div class="field">

      <label for="artistInput">
        Artist
      </label>

      <input
        id="artistInput"
        type="text"
        placeholder="Nama artist">

    </div>

    <div class="panel-buttons">

      <button id="cancelEdit">
        Batal
      </button>

      <button
        id="saveEdit"
        class="save">
        Simpan
      </button>

    </div>

  </section>


  <!-- FILE INPUTS -->

  <input
    id="imageInput"
    class="hidden-input"
    type="file"
    accept="image/*">

  <input
    id="audioInput"
    class="hidden-input"
    type="file"
    accept="audio/*">


  <!-- AUDIO -->

  <audio
    id="audio"
    crossorigin="anonymous">
  </audio>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const audio =
  document.getElementById("audio");

const cover =
  document.getElementById("cover");

const background =
  document.getElementById("background");

const playButton =
  document.getElementById("playButton");

const playIcon =
  document.getElementById("playIcon");

const imageInput =
  document.getElementById("imageInput");

const audioInput =
  document.getElementById("audioInput");

const coverButton =
  document.getElementById("coverButton");

const changeCover =
  document.getElementById("changeCover");

const changeAudio =
  document.getElementById("changeAudio");

const songTitle =
  document.getElementById("songTitle");

const artist =
  document.getElementById("artist");

const volume =
  document.getElementById("volume");

const volumeIcon =
  document.getElementById("volumeIcon");

const time =
  document.getElementById("time");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const editButton =
  document.getElementById("editButton");

const panel =
  document.getElementById("panel");

const titleInput =
  document.getElementById("titleInput");

const artistInput =
  document.getElementById("artistInput");

const saveEdit =
  document.getElementById("saveEdit");

const cancelEdit =
  document.getElementById("cancelEdit");

const progressSpectrum =
  document.getElementById("progressSpectrum");

const canvas =
  document.getElementById("visualizer");

const ctx =
  canvas.getContext("2d");


/* =====================================================
   DEFAULT COVER
===================================================== */

const defaultCover =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
  <svg xmlns="http://www.w3.org/2000/svg"
       width="800"
       height="800"
       viewBox="0 0 800 800">

    <defs>
      <linearGradient
        id="g"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
          offset="0"
          stop-color="#ff512f"/>

        <stop
          offset="0.5"
          stop-color="#dd2476"/>

        <stop
          offset="1"
          stop-color="#241bff"/>

      </linearGradient>
    </defs>

    <rect
      width="800"
      height="800"
      fill="url(#g)"/>

    <circle
      cx="400"
      cy="400"
      r="145"
      fill="rgba(0,0,0,.3)"/>

    <circle
      cx="400"
      cy="400"
      r="50"
      fill="#111"/>

  </svg>
`);


/* =====================================================
   INITIAL DATA
===================================================== */

cover.src = defaultCover;

background.style.backgroundImage =
  `url("${defaultCover}")`;

audio.volume = 1;


/* =====================================================
   AUDIO CONTEXT
===================================================== */

let audioContext = null;
let analyser = null;
let source = null;
let dataArray = null;

let audioConnected = false;


/* =====================================================
   CREATE AUDIO ANALYSER
===================================================== */

function setupAudio() {

  if (audioConnected) {
    return;
  }

  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  analyser =
    audioContext.createAnalyser();

  analyser.fftSize = 512;

  analyser.smoothingTimeConstant = 0.72;

  source =
    audioContext.createMediaElementSource(audio);

  source.connect(analyser);

  analyser.connect(audioContext.destination);

  dataArray =
    new Uint8Array(
      analyser.frequencyBinCount
    );

  audioConnected = true;
}


/* =====================================================
   RESUME AUDIO CONTEXT
===================================================== */

async function resumeAudioContext() {

  setupAudio();

  if (
    audioContext &&
    audioContext.state === "suspended"
  ) {

    await audioContext.resume();

  }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

async function togglePlay() {

  await resumeAudioContext();

  if (audio.paused) {

    try {

      await audio.play();

    } catch (error) {

      console.log(error);

    }

  } else {

    audio.pause();

  }

}


playButton.addEventListener(
  "click",
  togglePlay
);


/* =====================================================
   PLAY ICON
===================================================== */

audio.addEventListener(
  "play",
  () => {

    playIcon.className =
      "pause-icon";

  }
);


audio.addEventListener(
  "pause",
  () => {

    playIcon.className =
      "play-icon";

  }
);


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds) {

  if (!Number.isFinite(seconds)) {
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2, "0");

  return `${minutes}:${secs}`;

}


/* =====================================================
   TIME UPDATE
===================================================== */

audio.addEventListener(
  "timeupdate",
  updateProgress
);

audio.addEventListener(
  "loadedmetadata",
  updateProgress
);


function updateProgress() {

  const current =
    audio.currentTime || 0;

  const duration =
    audio.duration || 0;

  time.textContent =
    `${formatTime(current)} / ${formatTime(duration)}`;

  if (duration > 0) {

    const percent =
      (current / duration) * 100;

    progressSpectrum.style.width =
      `${percent}%`;

  } else {

    progressSpectrum.style.width =
      "0%";

  }

}


/* =====================================================
   SKIP
===================================================== */

prevButton.addEventListener(
  "click",
  () => {

    audio.currentTime =
      Math.max(
        0,
        audio.currentTime - 10
      );

  }
);


nextButton.addEventListener(
  "click",
  () => {

    audio.currentTime =
      Math.min(
        audio.duration || Infinity,
        audio.currentTime + 10
      );

  }
);


/* =====================================================
   VOLUME
===================================================== */

volume.addEventListener(
  "input",
  () => {

    audio.volume =
      Number(volume.value);

    updateVolumeIcon();

  }
);


function updateVolumeIcon() {

  const value =
    Number(volume.value);

  if (value === 0) {

    volumeIcon.textContent =
      "🔇";

  } else if (value < .5) {

    volumeIcon.textContent =
      "🔉";

  } else {

    volumeIcon.textContent =
      "🔊";

  }

}


/* =====================================================
   CHANGE COVER
===================================================== */

function openImagePicker() {

  imageInput.click();

}


coverButton.addEventListener(
  "click",
  openImagePicker
);

changeCover.addEventListener(
  "click",
  openImagePicker
);


imageInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    cover.src = url;

    background.style.backgroundImage =
      `url("${url}")`;

  }
);


/* =====================================================
   CHANGE AUDIO
===================================================== */

changeAudio.addEventListener(
  "click",
  () => {

    audioInput.click();

  }
);


document
  .getElementById("musicButton")
  .addEventListener(
    "click",
    () => audioInput.click()
  );


audioInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    audio.src = url;

    audio.load();

    playIcon.className =
      "play-icon";

    time.textContent =
      "0:00 / 0:00";

    progressSpectrum.style.width =
      "0%";

  }
);


/* =====================================================
   EDIT MUSIC
===================================================== */

editButton.addEventListener(
  "click",
  () => {

    titleInput.value =
      songTitle.textContent;

    artistInput.value =
      artist.textContent;

    panel.classList.add("show");

  }
);


cancelEdit.addEventListener(
  "click",
  () => {

    panel.classList.remove("show");

  }
);


saveEdit.addEventListener(
  "click",
  () => {

    const newTitle =
      titleInput.value.trim();

    const newArtist =
      artistInput.value.trim();

    songTitle.textContent =
      newTitle || "My Music";

    artist.textContent =
      newArtist || "Unknown Artist";

    checkMarquee(
      songTitle
    );

    checkMarquee(
      artist
    );

    panel.classList.remove(
      "show"
    );

  }
);


/* =====================================================
   MARQUEE CHECK
===================================================== */

function checkMarquee(element) {

  element.classList.remove(
    "marquee"
  );

  requestAnimationFrame(
    () => {

      if (
        element.scrollWidth >
        element.clientWidth + 5
      ) {

        element.classList.add(
          "marquee"
        );

      }

    }
  );

}


window.addEventListener(
  "resize",
  () => {

    checkMarquee(songTitle);
    checkMarquee(artist);

    resizeCanvas();

  }
);


/* =====================================================
   CANVAS RESIZE
===================================================== */

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}

resizeCanvas();


/* =====================================================
   SPECTRUM
===================================================== */

function drawSpectrum() {

  requestAnimationFrame(
    drawSpectrum
  );

  const rect =
    canvas.getBoundingClientRect();

  const width =
    rect.width;

  const height =
    rect.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  if (!analyser) {

    drawIdleSpectrum(
      width,
      height
    );

    return;

  }

  analyser.getByteFrequencyData(
    dataArray
  );


  const bars = 52;

  const gap = 2;

  const barWidth =
    (width - gap * (bars - 1))
    / bars;


  for (
    let i = 0;
    i < bars;
    i++
  ) {

    const index =
      Math.floor(
        Math.pow(
          i / bars,
          1.65
        ) *
        dataArray.length *
        .8
      );

    let value =
      dataArray[index] || 0;

    /*
      Tambahan bass boost supaya
      kick/bass lebih terasa.
    */

    if (i < 12) {

      value *= 1.18;

    }

    const normalized =
      Math.min(
        value / 255,
        1
      );

    const minHeight =
      4;

    const barHeight =
      minHeight +
      normalized *
      (height - minHeight - 8);

    const x =
      i *
      (barWidth + gap);

    const y =
      height -
      barHeight;

    const hue =
      (i / bars) * 300 +
      20;

    const gradient =
      ctx.createLinearGradient(
        0,
        y,
        0,
        height
      );

    gradient.addColorStop(
      0,
      `hsla(${hue},100%,68%,.95)`
    );

    gradient.addColorStop(
      .55,
      `hsla(${hue + 30},100%,58%,.9)`
    );

    gradient.addColorStop(
      1,
      `hsla(${hue + 60},100%,48%,.75)`
    );

    ctx.fillStyle =
      gradient;

    ctx.shadowBlur =
      normalized > .55
        ? 10
        : 4;

    ctx.shadowColor =
      `hsla(${hue},100%,60%,.75)`;


    roundRect(
      ctx,
      x,
      y,
      barWidth,
      barHeight,
      Math.min(
        barWidth / 2,
        3
      )
    );

    ctx.fill();

  }

  ctx.shadowBlur = 0;

}


/* =====================================================
   IDLE SPECTRUM
===================================================== */

function drawIdleSpectrum(
  width,
  height
) {

  const bars = 52;

  const gap = 2;

  const barWidth =
    (width - gap * (bars - 1))
    / bars;

  const timeNow =
    performance.now() / 600;

  for (
    let i = 0;
    i < bars;
    i++
  ) {

    const wave =
      (
        Math.sin(
          i * .42 +
          timeNow
        ) + 1
      ) / 2;

    const barHeight =
      5 +
      wave * 13;

    const x =
      i *
      (barWidth + gap);

    const y =
      height -
      barHeight;

    const hue =
      20 +
      (i / bars) * 300;

    ctx.fillStyle =
      `hsla(${hue},100%,65%,.45)`;

    roundRect(
      ctx,
      x,
      y,
      barWidth,
      barHeight,
      3
    );

    ctx.fill();

  }

}


/* =====================================================
   ROUNDED RECTANGLE
===================================================== */

function roundRect(
  context,
  x,
  y,
  width,
  height,
  radius
) {

  context.beginPath();

  context.roundRect(
    x,
    y,
    width,
    height,
    radius
  );

  context.closePath();

}


/* =====================================================
   AUDIO PLAY AUTO ANALYSER
===================================================== */

audio.addEventListener(
  "play",
  async () => {

    await resumeAudioContext();

  }
);


/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.code === "Space" &&
      event.target.tagName !== "INPUT"
    ) {

      event.preventDefault();

      togglePlay();

    }

    if (
      event.code === "ArrowRight"
    ) {

      audio.currentTime =
        Math.min(
          audio.duration || Infinity,
          audio.currentTime + 5
        );

    }

    if (
      event.code === "ArrowLeft"
    ) {

      audio.currentTime =
        Math.max(
          0,
          audio.currentTime - 5
        );

    }

  }
);


/* =====================================================
   START
===================================================== */

checkMarquee(songTitle);
checkMarquee(artist);

drawSpectrum();

</script>

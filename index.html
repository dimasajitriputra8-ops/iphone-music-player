<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>iPhone Music Player</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Arial,
                sans-serif;
}

body{
    color:white;
}

/* =========================================================
   BACKGROUND
========================================================= */

.player{
    position:relative;

    width:100vw;
    height:100vh;

    min-height:100svh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#111;
}

.background{
    position:absolute;
    inset:-8%;

    background-image:url("cover.jpg");
    background-position:center;
    background-size:cover;

    filter:blur(35px);
    transform:scale(1.12);

    opacity:.72;

    transition:
        background-image .5s ease,
        opacity .5s ease;
}

.background::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.25),
            rgba(0,0,0,.48)
        );
}

/* =========================================================
   MAIN CONTENT
========================================================= */

.content{
    position:relative;
    z-index:5;

    width:min(100%,520px);
    height:100%;

    display:flex;
    flex-direction:column;

    padding:
        max(38px,env(safe-area-inset-top))
        22px
        max(30px,env(safe-area-inset-bottom))
        22px;

    overflow:hidden;
}

/* =========================================================
   COVER
========================================================= */

.cover-area{
    width:100%;

    display:flex;
    justify-content:center;

    margin-top:5vh;
}

.cover{
    width:min(82vw,390px);
    aspect-ratio:1 / 1;

    object-fit:cover;

    border-radius:18px;

    display:block;

    box-shadow:
        0 18px 45px rgba(0,0,0,.35);

    cursor:pointer;

    transition:
        transform .25s ease,
        opacity .2s ease;
}

.cover:active{
    transform:scale(.97);
}

/* =========================================================
   SONG INFORMATION
========================================================= */

.info{
    width:100%;

    margin-top:25px;

    overflow:hidden;
}

.title{
    width:100%;

    font-size:25px;
    font-weight:700;

    line-height:1.2;

    white-space:nowrap;

    overflow:hidden;

    text-shadow:
        0 2px 8px rgba(0,0,0,.3);
}

.artist{
    margin-top:5px;

    font-size:19px;
    font-weight:400;

    color:rgba(255,255,255,.68);

    white-space:nowrap;

    overflow:hidden;

    text-shadow:
        0 2px 7px rgba(0,0,0,.25);

    cursor:pointer;
}

/* =========================================================
   MARQUEE
========================================================= */

.marquee{
    display:inline-block;

    padding-right:60px;

    animation:
        marquee 9s linear infinite;
}

@keyframes marquee{

    0%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(0);
    }

    80%{
        transform:translateX(
            calc(-100% + 100vw)
        );
    }

    100%{
        transform:translateX(
            calc(-100% + 100vw)
        );
    }

}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area{
    width:100%;

    margin-top:25px;
}

.progress{
    position:relative;

    width:100%;
    height:5px;

    border-radius:10px;

    background:
        rgba(255,255,255,.28);

    overflow:hidden;

    cursor:pointer;
}

.progress-fill{
    position:absolute;

    left:0;
    top:0;

    width:0%;
    height:100%;

    border-radius:10px;

    background:white;

    transition:width .05s linear;
}

.time-row{
    width:100%;

    display:flex;
    justify-content:space-between;

    margin-top:8px;

    font-size:14px;

    color:rgba(255,255,255,.72);
}

/* =========================================================
   MAIN CONTROL AREA
========================================================= */

.controls{
    width:100%;

    margin-top:35px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:clamp(30px,9vw,55px);
}

/* previous / next */

.skip{
    width:52px;
    height:52px;

    border:0;
    outline:0;

    background:none;

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    opacity:.96;
}

.skip svg{
    width:40px;
    height:40px;

    fill:white;
}

.skip:active{
    transform:scale(.87);
}

/* =========================================================
   SPECTRUM
========================================================= */

.spectrum-button{
    position:relative;

    width:90px;
    height:65px;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:none;
    border:0;

    cursor:pointer;
}

.spectrum{
    position:absolute;

    left:0;
    right:0;

    top:50%;

    transform:
        translateY(-50%);

    height:55px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:2px;

    overflow:hidden;

    opacity:.9;

    transition:
        opacity .25s ease;
}

.bar{
    width:2px;

    min-height:5px;

    height:15px;

    border-radius:4px;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 0 7px
        rgba(255,255,255,.28);

    transform-origin:center;

    transition:
        background .12s linear,
        height .06s linear,
        opacity .2s ease;
}

.bar.played{
    background:#ff7a18;

    box-shadow:
        0 0 8px
        rgba(255,110,20,.5);
}

/* play pause */

.play-icon{
    position:relative;

    z-index:20;

    width:34px;
    height:42px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    filter:
        drop-shadow(
            0 2px 6px
            rgba(0,0,0,.4)
        );

    pointer-events:none;
}

.play-icon svg{
    width:35px;
    height:35px;

    fill:white;
}

/* =========================================================
   VOLUME
========================================================= */

.volume-area{
    width:100%;

    margin-top:32px;

    display:flex;
    align-items:center;

    gap:11px;
}

.volume-icon{
    width:22px;
    height:22px;

    opacity:.85;

    flex:none;
}

.volume-icon svg{
    width:100%;
    height:100%;

    fill:white;
}

.volume-slider{
    position:relative;

    flex:1;

    height:5px;

    border-radius:10px;

    background:
        rgba(255,255,255,.28);

    cursor:pointer;
}

.volume-fill{
    position:absolute;

    left:0;
    top:0;

    height:100%;

    width:70%;

    border-radius:10px;

    background:white;
}

/* =========================================================
   AIRPLAY STYLE
========================================================= */

.output{
    display:flex;
    justify-content:center;

    margin-top:28px;
}

.output-button{
    min-width:165px;

    height:52px;

    padding:0 22px;

    border:none;

    border-radius:28px;

    background:
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    font-size:17px;

    box-shadow:
        inset 0 1px 1px
        rgba(255,255,255,.1);

    cursor:pointer;
}

.output-button svg{
    width:24px;
    height:24px;

    fill:white;
}

/* =========================================================
   EDIT BUTTONS
========================================================= */

.edit-panel{
    position:absolute;

    z-index:50;

    left:50%;
    bottom:20px;

    transform:
        translateX(-50%);

    display:flex;

    gap:8px;
}

.edit-button{
    border:none;

    padding:9px 14px;

    border-radius:20px;

    background:
        rgba(0,0,0,.45);

    color:white;

    backdrop-filter:blur(12px);

    font-size:12px;

    opacity:.7;

    cursor:pointer;
}

/* =========================================================
   FILE INPUT
========================================================= */

input[type="file"]{
    display:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-height:720px){

    .cover-area{
        margin-top:2vh;
    }

    .cover{
        width:min(68vw,300px);
    }

    .info{
        margin-top:16px;
    }

    .progress-area{
        margin-top:17px;
    }

    .controls{
        margin-top:22px;
    }

    .volume-area{
        margin-top:20px;
    }

    .output{
        margin-top:17px;
    }
}

@media(min-width:700px){

    .content{
        width:430px;
    }

    .cover{
        width:360px;
    }
}

</style>
</head>

<body>

<div class="player">

    <!-- BACKGROUND BLUR -->
    <div
        class="background"
        id="background">
    </div>


    <!-- MAIN -->
    <main class="content">


        <!-- COVER -->
        <div class="cover-area">

            <img
                id="cover"
                class="cover"
                src="cover.jpg"
                alt="Album Cover">

            <input
                type="file"
                id="imageInput"
                accept="image/*">

        </div>


        <!-- INFORMATION -->
        <div class="info">

            <div
                id="title"
                class="title">
                No Music Selected
            </div>

            <div
                id="artist"
                class="artist"
                title="Klik untuk mengganti artist">
                Artist
            </div>

        </div>


        <!-- PROGRESS -->
        <div class="progress-area">

            <div
                class="progress"
                id="progress">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    -0:00
                </span>

            </div>

        </div>


        <!-- CONTROLS -->
        <div class="controls">


            <!-- PREVIOUS / REWIND -->
            <button
                class="skip"
                id="prevButton"
                aria-label="Previous">

                <svg viewBox="0 0 64 64">

                    <rect
                        x="9"
                        y="17"
                        width="7"
                        height="30"
                        rx="2"/>

                    <path
                        d="
                        M53 15
                        L26 32
                        L53 49
                        Z
                        "/>

                </svg>

            </button>


            <!-- SPECTRUM + PLAY PAUSE -->
            <button
                class="spectrum-button"
                id="playButton"
                aria-label="Play">

                <div
                    class="spectrum"
                    id="spectrum">
                </div>

                <div
                    class="play-icon"
                    id="playIcon">
                </div>

            </button>


            <!-- NEXT / FORWARD -->
            <button
                class="skip"
                id="nextButton"
                aria-label="Next">

                <svg viewBox="0 0 64 64">

                    <path
                        d="
                        M11 15
                        L38 32
                        L11 49
                        Z
                        "/>

                    <rect
                        x="48"
                        y="17"
                        width="7"
                        height="30"
                        rx="2"/>

                </svg>

            </button>

        </div>


        <!-- VOLUME -->
        <div class="volume-area">


            <div class="volume-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M3 9v6h4l5 4V5L7 9H3z
                        M16.5 8.5
                        a5 5 0 0 1 0 7
                        l1.4 1.4
                        a7 7 0 0 0 0-9.8
                        l-1.4 1.4z
                        M19 6
                        a9 9 0 0 1 0 12
                        l1.4 1.4
                        a11 11 0 0 0 0-14.8
                        L19 6z
                        "/>

                </svg>

            </div>


            <div
                class="volume-slider"
                id="volumeSlider">

                <div
                    class="volume-fill"
                    id="volumeFill">
                </div>

            </div>


            <div class="volume-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M3 9v6h4l5 4V5L7 9H3z
                        M16.5 8.5
                        a5 5 0 0 1 0 7
                        l1.4 1.4
                        a7 7 0 0 0 0-9.8
                        l-1.4 1.4z
                        M19 6
                        a9 9 0 0 1 0 12
                        l1.4 1.4
                        a11 11 0 0 0 0-14.8
                        L19 6z
                        "/>

                </svg>

            </div>

        </div>


        <!-- AIRPLAY -->
        <div class="output">

            <button
                class="output-button">

                <svg viewBox="0 0 24 24">

                    <path
                        d="
                        M12 3
                        a7 7 0 0 1 7 7
                        h2
                        a9 9 0 0 0-18 0
                        h2
                        a7 7 0 0 1 7-7z

                        M12 7
                        a3 3 0 0 1 3 3
                        h2
                        a5 5 0 0 0-10 0
                        h2
                        a3 3 0 0 1 3-3z

                        M12 14
                        l-5 5h3v3h4v-3h3l-5-5z
                        "/>

                </svg>

                <span>iPhone</span>

            </button>

        </div>


        <!-- HIDDEN AUDIO INPUT -->
        <input
            type="file"
            id="audioInput"
            accept="audio/*">


    </main>


    <!-- EDIT BUTTONS -->
    <div class="edit-panel">

        <button
            class="edit-button"
            id="changeAudio">
            Ganti Audio
        </button>

        <button
            class="edit-button"
            id="editArtist">
            Edit Artist
        </button>

    </div>

</div>


<audio
    id="audio"
    preload="metadata">
</audio>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const audio =
    document.getElementById("audio");

const cover =
    document.getElementById("cover");

const background =
    document.getElementById("background");

const imageInput =
    document.getElementById("imageInput");

const audioInput =
    document.getElementById("audioInput");

const title =
    document.getElementById("title");

const artist =
    document.getElementById("artist");

const playButton =
    document.getElementById("playButton");

const playIcon =
    document.getElementById("playIcon");

const spectrum =
    document.getElementById("spectrum");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const volumeSlider =
    document.getElementById("volumeSlider");

const volumeFill =
    document.getElementById("volumeFill");

const changeAudio =
    document.getElementById("changeAudio");

const editArtist =
    document.getElementById("editArtist");


/* =========================================================
   STATE
========================================================= */

let audioContext = null;
let analyser = null;
let source = null;

let dataArray = null;

let bars = [];

let audioLoaded = false;

let currentObjectURL = null;

let currentImageURL = null;

let artistName = "Artist";

let animationFrame;


/* =========================================================
   DEFAULT COVER
========================================================= */

const defaultCover =
    "cover.jpg";


/* =========================================================
   PLAY ICON
========================================================= */

function showPlayIcon(){

    playIcon.innerHTML = `

        <svg viewBox="0 0 64 64">

            <path
                d="
                M23 15
                L50 32
                L23 49
                Z
                ">
            </path>

        </svg>

    `;
}


function showPauseIcon(){

    playIcon.innerHTML = `

        <svg viewBox="0 0 64 64">

            <rect
                x="19"
                y="15"
                width="10"
                height="34"
                rx="2">
            </rect>

            <rect
                x="35"
                y="15"
                width="10"
                height="34"
                rx="2">
            </rect>

        </svg>

    `;
}


showPlayIcon();


/* =========================================================
   CREATE SPECTRUM
========================================================= */

function createSpectrum(){

    spectrum.innerHTML = "";

    bars = [];

    const count = 42;

    for(
        let i = 0;
        i < count;
        i++
    ){

        const bar =
            document.createElement("div");

        bar.className = "bar";

        bar.style.height =
            `${5 + Math.random() * 15}px`;

        spectrum.appendChild(bar);

        bars.push(bar);
    }
}

createSpectrum();


/* =========================================================
   AUDIO ANALYSER
========================================================= */

function setupAudio(){

    if(audioContext)
        return;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 512;

    analyser.smoothingTimeConstant =
        0.65;

    dataArray =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    source =
        audioContext.createMediaElementSource(
            audio
        );

    source.connect(analyser);

    analyser.connect(
        audioContext.destination
    );

    animateSpectrum();
}


/* =========================================================
   SPECTRUM ANIMATION
========================================================= */

function animateSpectrum(){

    animationFrame =
        requestAnimationFrame(
            animateSpectrum
        );

    if(
        !analyser ||
        !bars.length
    ){
        return;
    }

    analyser.getByteFrequencyData(
        dataArray
    );

    const progressValue =
        audio.duration
        ? audio.currentTime /
          audio.duration
        : 0;

    for(
        let i = 0;
        i < bars.length;
        i++
    ){

        const position =
            i / bars.length;

        const index =
            Math.floor(
                position *
                Math.min(
                    dataArray.length,
                    150
                )
            );

        let value =
            dataArray[index] || 0;


        /*
           Tambahan bass boost.
           Bar awal mengambil frekuensi
           rendah sehingga gerakannya
           terasa lebih responsif.
        */

        if(i < bars.length * .3){

            value =
                Math.min(
                    255,
                    value * 1.35
                );
        }


        let height =
            5 +
            (value / 255) * 48;


        /*
           Variasi abstrak supaya
           tidak semua bar naik rata.
        */

        const wave =
            Math.sin(
                Date.now() * .006 +
                i * .8
            ) * 4;


        height += wave;


        height =
            Math.max(
                5,
                Math.min(
                    55,
                    height
                )
            );


        bars[i].style.height =
            `${height}px`;


        /*
           Warna orange mengikuti
           posisi durasi lagu.
        */

        if(
            position <= progressValue
        ){

            bars[i].classList.add(
                "played"
            );

        }else{

            bars[i].classList.remove(
                "played"
            );
        }

    }

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

playButton.addEventListener(
    "click",
    async () => {

        if(!audio.src){

            audioInput.click();

            return;
        }


        setupAudio();


        if(
            audioContext.state ===
            "suspended"
        ){

            await audioContext.resume();
        }


        if(audio.paused){

            try{

                await audio.play();

                showPauseIcon();

            }catch(error){

                console.log(error);

            }

        }else{

            audio.pause();

            showPlayIcon();

        }

    }
);


/* =========================================================
   AUDIO FILE
========================================================= */

changeAudio.addEventListener(
    "click",
    () => {

        audioInput.click();

    }
);


audioInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if(!file)
            return;


        if(currentObjectURL){

            URL.revokeObjectURL(
                currentObjectURL
            );

        }


        currentObjectURL =
            URL.createObjectURL(file);


        audio.src =
            currentObjectURL;


        audio.load();


        audioLoaded = true;


        /*
           Nama file menjadi judul.
        */

        let fileName =
            file.name
                .replace(/\.[^/.]+$/, "");


        title.textContent =
            fileName;


        checkMarquee(
            title
        );


        currentTime.textContent =
            "0:00";


        duration.textContent =
            "-0:00";


        progressFill.style.width =
            "0%";


        /*
           Jangan otomatis play.
        */

        showPlayIcon();

    }
);


/* =========================================================
   IMAGE CHANGE
========================================================= */

cover.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if(!file)
            return;


        if(currentImageURL){

            URL.revokeObjectURL(
                currentImageURL
            );

        }


        currentImageURL =
            URL.createObjectURL(file);


        cover.src =
            currentImageURL;


        updateBackground(
            currentImageURL
        );

    }
);


/* =========================================================
   BACKGROUND
========================================================= */

function updateBackground(
    image
){

    background.style.backgroundImage =
        `url("${image}")`;

}


/* =========================================================
   EDIT ARTIST
========================================================= */

editArtist.addEventListener(
    "click",
    () => {

        const value =
            prompt(
                "Masukkan nama artist:",
                artistName
            );


        if(
            value !== null &&
            value.trim() !== ""
        ){

            artistName =
                value.trim();

            artist.textContent =
                artistName;

            checkMarquee(
                artist
            );

        }

    }
);


artist.addEventListener(
    "click",
    () => {

        editArtist.click();

    }
);


/* =========================================================
   MARQUEE
========================================================= */

function checkMarquee(
    element
){

    element.classList.remove(
        "marquee"
    );


    /*
       Tunggu browser menghitung
       lebar teks.
    */

    requestAnimationFrame(
        () => {

            if(
                element.scrollWidth >
                element.clientWidth
            ){

                element.classList.add(
                    "marquee"
                );

            }

        }
    );

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(
    seconds
){

    if(
        !Number.isFinite(seconds)
    ){

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2,"0");


    return `${minutes}:${secs}`;

}


/* =========================================================
   AUDIO METADATA
========================================================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            "-" +
            formatTime(
                audio.duration
            );

    }
);


/* =========================================================
   AUDIO TIME
========================================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if(
            !audio.duration
        )
            return;


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            `${percent}%`;


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            "-" +
            formatTime(
                audio.duration -
                audio.currentTime
            );

    }
);


/* =========================================================
   PROGRESS CLICK
========================================================= */

progress.addEventListener(
    "click",
    event => {

        if(
            !audio.duration
        )
            return;


        const rect =
            progress.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const percent =
            Math.max(
                0,
                Math.min(
                    1,
                    x / rect.width
                )
            );


        audio.currentTime =
            percent *
            audio.duration;

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

prevButton.addEventListener(
    "click",
    () => {

        if(
            audio.currentTime > 3
        ){

            audio.currentTime =
                0;

            return;

        }


        audio.currentTime =
            Math.max(
                0,
                audio.currentTime - 10
            );

    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if(
            !audio.duration
        )
            return;


        audio.currentTime =
            Math.min(
                audio.duration,
                audio.currentTime + 10
            );

    }
);


/* =========================================================
   AUDIO ENDED
========================================================= */

audio.addEventListener(
    "ended",
    () => {

        showPlayIcon();

        progressFill.style.width =
            "100%";

    }
);


/* =========================================================
   VOLUME
========================================================= */

let volume =
    0.7;


audio.volume =
    volume;


volumeFill.style.width =
    `${volume * 100}%`;


volumeSlider.addEventListener(
    "click",
    event => {

        const rect =
            volumeSlider.getBoundingClientRect();


        let value =
            (
                event.clientX -
                rect.left
            ) /
            rect.width;


        value =
            Math.max(
                0,
                Math.min(
                    1,
                    value
                )
            );


        volume =
            value;


        audio.volume =
            value;


        volumeFill.style.width =
            `${value * 100}%`;

    }
);


/* =========================================================
   TOUCH VOLUME
========================================================= */

let draggingVolume =
    false;


volumeSlider.addEventListener(
    "pointerdown",
    () => {

        draggingVolume =
            true;

    }
);


window.addEventListener(
    "pointerup",
    () => {

        draggingVolume =
            false;

    }
);


window.addEventListener(
    "pointermove",
    event => {

        if(!draggingVolume)
            return;


        const rect =
            volumeSlider.getBoundingClientRect();


        let value =
            (
                event.clientX -
                rect.left
            ) /
            rect.width;


        value =
            Math.max(
                0,
                Math.min(
                    1,
                    value
                )
            );


        audio.volume =
            value;


        volumeFill.style.width =
            `${value * 100}%`;

    }
);


/* =========================================================
   INITIAL BACKGROUND
========================================================= */

updateBackground(
    defaultCover
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        checkMarquee(title);

        checkMarquee(artist);

    }
);

</script>

</body>
</html>

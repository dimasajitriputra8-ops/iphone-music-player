<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>iPhone Music Player</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }


        body {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }


        /* =========================================
           MAIN PLAYER
        ========================================= */

        .player {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #050505;

            isolation: isolate;
        }


        /* =========================================
           BLURRED BACKGROUND
        ========================================= */

        .background {

            position: absolute;

            inset: -45px;

            z-index: -4;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.65)
                ),
                var(--cover-image);

            background-position: center;
            background-size: cover;

            filter: blur(38px);

            transform: scale(1.12);

            transition:
                background-image 0.5s ease,
                filter 0.5s ease;
        }


        .background-overlay {

            position: absolute;

            inset: 0;

            z-index: -3;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.16) 0%,
                    rgba(0, 0, 0, 0.08) 35%,
                    rgba(0, 0, 0, 0.40) 70%,
                    rgba(0, 0, 0, 0.76) 100%
                );

            pointer-events: none;
        }


        /* =========================================
           CONTENT
        ========================================= */

        .content {

            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding:
                max(34px, env(safe-area-inset-top))
                20px
                max(24px, env(safe-area-inset-bottom))
                20px;
        }


        /* =========================================
           TOP
        ========================================= */

        .top-area {

            width: 100%;

            height: 54px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .top-left {

            width: 42px;
            height: 42px;

            opacity: 0;
        }


        .top-title {

            font-size: 15px;

            font-weight: 600;

            letter-spacing: -0.2px;

            opacity: 0.95;
        }


        .top-right {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;
        }


        .top-right svg {

            width: 23px;
            height: 23px;

            fill: white;
        }


        /* =========================================
           COVER
        ========================================= */

        .cover-area {

            width: 100%;

            flex: 1;

            min-height: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                18px
                0
                8px;
        }


        .cover-button {

            position: relative;

            border: none;

            background: transparent;

            padding: 0;

            width: min(78vw, 370px);
            height: min(78vw, 370px);

            max-width: 370px;
            max-height: 370px;

            border-radius: 7px;

            overflow: hidden;

            cursor: pointer;

            box-shadow:
                0 24px 65px rgba(0, 0, 0, 0.50),
                0 0 35px rgba(255, 255, 255, 0.05);
        }


        .cover-image {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: inherit;

            user-select: none;

            transition:
                transform 0.35s ease,
                opacity 0.25s ease;
        }


        .cover-button:active .cover-image {

            transform: scale(0.975);
        }


        .cover-hint {

            position: absolute;

            left: 50%;
            bottom: 16px;

            transform: translateX(-50%);

            padding: 7px 13px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.60);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            font-size: 11px;

            font-weight: 500;

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.2s ease;
        }


        .cover-button:hover .cover-hint {

            opacity: 1;
        }


        /* =========================================
           SONG INFO
        ========================================= */

        .song-info {

            width: 100%;

            max-width: 600px;

            padding:
                4px
                3px
                0;
        }


        .title-window {

            width: 100%;

            overflow: hidden;

            white-space: nowrap;

            position: relative;
        }


        .song-title {

            display: inline-block;

            font-size: 22px;

            line-height: 28px;

            font-weight: 700;

            letter-spacing: -0.55px;

            white-space: nowrap;
        }


        .song-title.scrolling {

            padding-right: 50px;

            animation:
                titleScroll
                11s
                linear
                infinite;
        }


        @keyframes titleScroll {

            0% {
                transform: translateX(0);
            }

            15% {
                transform: translateX(0);
            }

            85% {
                transform: translateX(
                    calc(-100% + 100vw - 100px)
                );
            }

            100% {
                transform: translateX(
                    calc(-100% + 100vw - 100px)
                );
            }
        }


        .artist-row {

            width: 100%;

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 2px;
        }


        .artist-name {

            min-width: 0;

            max-width: calc(100% - 40px);

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 16px;

            line-height: 22px;

            color: rgba(255,255,255,0.72);

            font-weight: 500;
        }


        .edit-artist {

            flex-shrink: 0;

            border: none;

            background: transparent;

            color: rgba(255,255,255,0.60);

            cursor: pointer;

            padding: 3px;

            font-size: 14px;
        }


        /* =========================================
           SPECTRUM AREA
        ========================================= */

        .spectrum-section {

            width: 100%;

            max-width: 600px;

            height: 112px;

            margin-top: 12px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        .spectrum-wrapper {

            position: relative;

            width: 100%;

            height: 92px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        /*
            Canvas hanya berisi spectrum.
            Tidak ada background/card.
        */

        #spectrumCanvas {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

            pointer-events: none;
        }


        /*
            Play button benar-benar transparan.
            Hanya icon yang terlihat.
        */

        .play-button {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 60px;
            height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            color: white;

            cursor: pointer;

            z-index: 5;
        }


        .play-button:active {

            transform:
                translate(-50%, -50%)
                scale(0.90);
        }


        .play-icon {

            position: relative;

            width: 0;
            height: 0;

            margin-left: 5px;

            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 18px solid white;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(255,255,255,0.40)
                );

            transition:
                border 0.2s ease;
        }


        .play-icon.pause {

            width: 18px;
            height: 23px;

            margin-left: 0;

            border: none;

            background:
                linear-gradient(
                    to right,
                    white 0 5px,
                    transparent 5px 11px,
                    white 11px 16px
                );

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(255,255,255,0.40)
                );
        }


        /* =========================================
           TIME
        ========================================= */

        .time-row {

            width: 100%;

            max-width: 600px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 2px;

            font-size: 11px;

            color: rgba(255,255,255,0.66);

            font-variant-numeric: tabular-nums;
        }


        /* =========================================
           VOLUME
        ========================================= */

        .volume-area {

            width: 100%;

            max-width: 600px;

            height: 42px;

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 5px;
        }


        .volume-icon {

            width: 22px;
            height: 22px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .volume-icon svg {

            width: 19px;
            height: 19px;

            fill: white;

            opacity: 0.88;
        }


        .volume-slider {

            appearance: none;
            -webkit-appearance: none;

            width: 100%;
            height: 4px;

            border-radius: 10px;

            outline: none;

            background:
                linear-gradient(
                    to right,
                    rgba(255,255,255,0.95) 0%,
                    rgba(255,255,255,0.95) var(--volume),
                    rgba(255,255,255,0.22) var(--volume),
                    rgba(255,255,255,0.22) 100%
                );
        }


        .volume-slider::-webkit-slider-thumb {

            appearance: none;
            -webkit-appearance: none;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 5px rgba(0,0,0,0.45);

            cursor: pointer;
        }


        .volume-slider::-moz-range-thumb {

            width: 13px;
            height: 13px;

            border: none;

            border-radius: 50%;

            background: white;

            cursor: pointer;
        }


        /* =========================================
           BOTTOM ACTIONS
        ========================================= */

        .bottom-actions {

            width: 100%;

            max-width: 600px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin-top: 7px;

            padding-bottom: 2px;
        }


        .action-button {

            border: none;

            min-height: 34px;

            padding: 0 13px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.09);

            color: white;

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            border:
                1px solid
                rgba(255,255,255,0.08);

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        .action-button:active {

            transform: scale(0.96);

            background:
                rgba(255,255,255,0.15);
        }


        /* =========================================
           FILE INPUT
        ========================================= */

        .hidden-input {

            display: none;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (min-aspect-ratio: 9/16) {

            .player {

                width: min(100vw, 560px);

                height: 100vh;
            }
        }


        @media (max-height: 700px) {

            .top-area {

                height: 42px;
            }

            .cover-area {

                padding-top: 5px;
            }

            .cover-button {

                width: min(67vw, 280px);
                height: min(67vw, 280px);
            }

            .spectrum-section {

                height: 92px;
            }

            .spectrum-wrapper {

                height: 78px;
            }

            .song-title {

                font-size: 20px;
            }
        }


        @media (max-height: 590px) {

            .cover-button {

                width: min(52vw, 225px);
                height: min(52vw, 225px);
            }

            .spectrum-section {

                height: 75px;
            }

            .spectrum-wrapper {

                height: 66px;
            }

            .volume-area {

                height: 30px;
            }

            .bottom-actions {

                margin-top: 0;
            }
        }


    </style>

</head>


<body>


    <main
        class="player"
        id="player"
        style="--cover-image: url('https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1000&q=90');">


        <!-- BLURRED BACKGROUND -->

        <div
            class="background"
            id="background">
        </div>

        <div
            class="background-overlay">
        </div>


        <div class="content">


            <!-- =====================================
                 TOP
            ====================================== -->

            <div class="top-area">

                <div class="top-left"></div>

                <div class="top-title">
                    Music
                </div>

                <button
                    class="top-right"
                    id="audioMenuButton"
                    aria-label="Ganti audio">

                    <svg
                        viewBox="0 0 24 24">

                        <path
                            d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z">
                        </path>

                    </svg>

                </button>

            </div>


            <!-- =====================================
                 COVER
            ====================================== -->

            <div class="cover-area">

                <button
                    class="cover-button"
                    id="coverButton"
                    aria-label="Ganti foto cover">

                    <img
                        class="cover-image"
                        id="coverImage"
                        alt="Album Cover"
                        draggable="false"
                        src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1000&q=90">

                    <span class="cover-hint">
                        Ganti Foto
                    </span>

                </button>

            </div>


            <!-- =====================================
                 SONG INFO
            ====================================== -->

            <div class="song-info">


                <div class="title-window">

                    <div
                        class="song-title"
                        id="songTitle">

                        Your Music

                    </div>

                </div>


                <div class="artist-row">

                    <div
                        class="artist-name"
                        id="artistName">

                        Your Artist

                    </div>


                    <button
                        class="edit-artist"
                        id="editArtist"
                        aria-label="Edit artist">

                        ✎

                    </button>

                </div>


            </div>


            <!-- =====================================
                 SPECTRUM
            ====================================== -->

            <div class="spectrum-section">

                <div class="spectrum-wrapper">

                    <canvas
                        id="spectrumCanvas">
                    </canvas>


                    <button
                        class="play-button"
                        id="playButton"
                        aria-label="Play">

                        <div
                            class="play-icon"
                            id="playIcon">
                        </div>

                    </button>

                </div>

            </div>


            <!-- =====================================
                 TIME
            ====================================== -->

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>


            <!-- =====================================
                 VOLUME
            ====================================== -->

            <div class="volume-area">


                <div class="volume-icon">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z">
                        </path>

                    </svg>

                </div>


                <input
                    class="volume-slider"
                    id="volumeSlider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                    style="--volume: 80%;">

            </div>


            <!-- =====================================
                 ACTION BUTTONS
            ====================================== -->

            <div class="bottom-actions">

                <button
                    class="action-button"
                    id="changeAudioButton">

                    Ganti Audio

                </button>

                <button
                    class="action-button"
                    id="changeCoverButton">

                    Ganti Foto

                </button>

            </div>


        </div>


        <!-- =====================================
             AUDIO
        ====================================== -->

        <audio
            id="audio"
            preload="metadata">
        </audio>


        <!-- =====================================
             FILE INPUTS
        ====================================== -->

        <input
            class="hidden-input"
            type="file"
            id="audioInput"
            accept="audio/*">

        <input
            class="hidden-input"
            type="file"
            id="coverInput"
            accept="image/*">


    </main>


    <script>


        /* =========================================
           ELEMENTS
        ========================================= */

        const player =
            document.getElementById("player");

        const audio =
            document.getElementById("audio");

        const coverButton =
            document.getElementById("coverButton");

        const coverImage =
            document.getElementById("coverImage");

        const background =
            document.getElementById("background");

        const playButton =
            document.getElementById("playButton");

        const playIcon =
            document.getElementById("playIcon");

        const canvas =
            document.getElementById("spectrumCanvas");

        const canvasContext =
            canvas.getContext("2d");

        const songTitle =
            document.getElementById("songTitle");

        const artistName =
            document.getElementById("artistName");

        const editArtist =
            document.getElementById("editArtist");

        const audioInput =
            document.getElementById("audioInput");

        const coverInput =
            document.getElementById("coverInput");

        const changeAudioButton =
            document.getElementById("changeAudioButton");

        const changeCoverButton =
            document.getElementById("changeCoverButton");

        const audioMenuButton =
            document.getElementById("audioMenuButton");

        const volumeSlider =
            document.getElementById("volumeSlider");

        const currentTimeElement =
            document.getElementById("currentTime");

        const durationElement =
            document.getElementById("duration");


        /* =========================================
           DEFAULT AUDIO
        ========================================= */

        let audioURL = null;

        let coverURL = null;


        /* =========================================
           AUDIO ANALYSER
        ========================================= */

        let audioContext = null;

        let analyser = null;

        let sourceNode = null;

        let frequencyData = null;

        let audioReady = false;


        /* =========================================
           SPECTRUM SETTINGS
        ========================================= */

        const BAR_COUNT = 72;

        let bars = new Array(BAR_COUNT)
            .fill(0);

        let smoothBars = new Array(BAR_COUNT)
            .fill(0);

        let progressBars = new Array(BAR_COUNT)
            .fill(0);


        /* =========================================
           INIT AUDIO CONTEXT
        ========================================= */

        function initAudioAnalyser() {

            if (audioContext) {
                return;
            }


            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;


            if (!AudioContextClass) {
                return;
            }


            audioContext =
                new AudioContextClass();


            analyser =
                audioContext.createAnalyser();


            analyser.fftSize = 1024;


            analyser.smoothingTimeConstant =
                0.58;


            frequencyData =
                new Uint8Array(
                    analyser.frequencyBinCount
                );


            sourceNode =
                audioContext.createMediaElementSource(
                    audio
                );


            sourceNode.connect(analyser);

            analyser.connect(
                audioContext.destination
            );


            audioReady = true;
        }


        /* =========================================
           RESUME AUDIO CONTEXT
        ========================================= */

        async function resumeAudioContext() {

            initAudioAnalyser();


            if (
                audioContext &&
                audioContext.state === "suspended"
            ) {

                await audioContext.resume();

            }

        }


        /* =========================================
           PLAY / PAUSE
        ========================================= */

        playButton.addEventListener(
            "click",
            async function () {

                await resumeAudioContext();


                if (!audio.src) {

                    audioInput.click();

                    return;
                }


                if (audio.paused) {

                    try {

                        await audio.play();

                    } catch (error) {

                        console.log(error);

                    }

                } else {

                    audio.pause();

                }

            }
        );


        /* =========================================
           AUDIO PLAY
        ========================================= */

        audio.addEventListener(
            "play",
            function () {

                playIcon.classList.add("pause");

            }
        );


        /* =========================================
           AUDIO PAUSE
        ========================================= */

        audio.addEventListener(
            "pause",
            function () {

                playIcon.classList.remove("pause");

            }
        );


        /* =========================================
           AUDIO ENDED
        ========================================= */

        audio.addEventListener(
            "ended",
            function () {

                playIcon.classList.remove("pause");

            }
        );


        /* =========================================
           AUDIO FILE
        ========================================= */

        audioInput.addEventListener(
            "change",
            function (event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                if (audioURL) {

                    URL.revokeObjectURL(
                        audioURL
                    );

                }


                audioURL =
                    URL.createObjectURL(file);


                audio.src =
                    audioURL;


                audio.load();


                /*
                    Nama file menjadi judul.
                */

                let filename =
                    file.name;


                filename =
                    filename.replace(
                        /\.[^/.]+$/,
                        ""
                    );


                filename =
                    filename.replace(
                        /[_-]+/g,
                        " "
                    );


                songTitle.textContent =
                    filename;


                updateTitleScrolling();


                currentTimeElement.textContent =
                    "0:00";


                durationElement.textContent =
                    "0:00";


                /*
                    Reset file input agar
                    file yang sama bisa dipilih lagi.
                */

                audioInput.value = "";


                initAudioAnalyser();

            }
        );


        /* =========================================
           AUDIO MENU
        ========================================= */

        audioMenuButton.addEventListener(
            "click",
            function () {

                audioInput.click();

            }
        );


        changeAudioButton.addEventListener(
            "click",
            function () {

                audioInput.click();

            }
        );


        /* =========================================
           COVER CLICK
        ========================================= */

        coverButton.addEventListener(
            "click",
            function () {

                coverInput.click();

            }
        );


        changeCoverButton.addEventListener(
            "click",
            function () {

                coverInput.click();

            }
        );


        /* =========================================
           COVER FILE
        ========================================= */

        coverInput.addEventListener(
            "change",
            function (event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                if (coverURL) {

                    URL.revokeObjectURL(
                        coverURL
                    );

                }


                coverURL =
                    URL.createObjectURL(file);


                setCover(
                    coverURL
                );


                coverInput.value = "";

            }
        );


        /* =========================================
           SET COVER
        ========================================= */

        function setCover(url) {

            coverImage.style.opacity = "0";


            setTimeout(
                function () {

                    coverImage.src = url;

                    player.style
                        .setProperty(
                            "--cover-image",
                            `url("${url}")`
                        );

                    background.style
                        .backgroundImage =
                        `
                        linear-gradient(
                            rgba(0,0,0,0.30),
                            rgba(0,0,0,0.65)
                        ),
                        url("${url}")
                        `;


                    coverImage.style.opacity =
                        "1";

                },
                120
            );

        }


        /* =========================================
           EDIT ARTIST
        ========================================= */

        editArtist.addEventListener(
            "click",
            function () {

                const current =
                    artistName.textContent.trim();


                const result =
                    prompt(
                        "Masukkan nama artist:",
                        current
                    );


                if (
                    result !== null &&
                    result.trim() !== ""
                ) {

                    artistName.textContent =
                        result.trim();

                }

            }
        );


        /* =========================================
           TITLE SCROLL
        ========================================= */

        function updateTitleScrolling() {

            songTitle.classList.remove(
                "scrolling"
            );


            requestAnimationFrame(
                function () {

                    const container =
                        songTitle.parentElement;


                    if (
                        songTitle.scrollWidth >
                        container.clientWidth
                    ) {

                        songTitle.classList.add(
                            "scrolling"
                        );

                    }

                }
            );

        }


        window.addEventListener(
            "resize",
            updateTitleScrolling
        );


        /* =========================================
           FORMAT TIME
        ========================================= */

        function formatTime(seconds) {

            if (
                !Number.isFinite(seconds) ||
                seconds < 0
            ) {

                return "0:00";

            }


            const minutes =
                Math.floor(
                    seconds / 60
                );


            const remaining =
                Math.floor(
                    seconds % 60
                );


            return (
                minutes +
                ":" +
                String(remaining).padStart(
                    2,
                    "0"
                )
            );

        }


        /* =========================================
           AUDIO METADATA
        ========================================= */

        audio.addEventListener(
            "loadedmetadata",
            function () {

                durationElement.textContent =
                    formatTime(
                        audio.duration
                    );

            }
        );


        /* =========================================
           TIME UPDATE
        ========================================= */

        audio.addEventListener(
            "timeupdate",
            function () {

                currentTimeElement.textContent =
                    formatTime(
                        audio.currentTime
                    );

            }
        );


        /* =========================================
           VOLUME
        ========================================= */

        audio.volume =
            Number(volumeSlider.value);


        function updateVolumeUI() {

            const value =
                Number(volumeSlider.value);


            const percent =
                value * 100;


            volumeSlider.style
                .setProperty(
                    "--volume",
                    percent + "%"
                );

        }


        volumeSlider.addEventListener(
            "input",
            function () {

                audio.volume =
                    Number(
                        volumeSlider.value
                    );


                updateVolumeUI();

            }
        );


        updateVolumeUI();


        /* =========================================
           CANVAS SIZE
        ========================================= */

        function resizeCanvas() {

            const rect =
                canvas.getBoundingClientRect();


            const ratio =
                Math.max(
                    1,
                    window.devicePixelRatio || 1
                );


            canvas.width =
                rect.width * ratio;


            canvas.height =
                rect.height * ratio;


            canvasContext.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );

        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();


        /* =========================================
           GET FREQUENCY VALUE
        ========================================= */

        function getFrequencyValue(
            index
        ) {

            if (
                !frequencyData
            ) {

                return 0;

            }


            /*
                Bagian awal frekuensi
                dibuat lebih sensitif
                terhadap kick dan bass.
            */

            const bassLimit =
                Math.floor(
                    frequencyData.length *
                    0.16
                );


            if (
                index <
                BAR_COUNT * 0.28
            ) {

                const bassIndex =
                    Math.floor(
                        index /
                        (BAR_COUNT * 0.28) *
                        bassLimit
                    );


                return frequencyData[
                    Math.min(
                        bassIndex,
                        frequencyData.length - 1
                    )
                ];

            }


            const normalized =
                index /
                BAR_COUNT;


            /*
                Non-linear mapping
                supaya spectrum tidak rata.
            */

            const mapped =
                Math.pow(
                    normalized,
                    1.65
                );


            const dataIndex =
                Math.floor(
                    mapped *
                    (
                        frequencyData.length - 1
                    )
                );


            return frequencyData[
                Math.min(
                    dataIndex,
                    frequencyData.length - 1
                )
            ];

        }


        /* =========================================
           DRAW SPECTRUM
        ========================================= */

        function drawSpectrum() {

            const rect =
                canvas.getBoundingClientRect();


            const width =
                rect.width;


            const height =
                rect.height;


            canvasContext.clearRect(
                0,
                0,
                width,
                height
            );


            let progress = 0;


            if (
                audio.duration &&
                Number.isFinite(
                    audio.duration
                )
            ) {

                progress =
                    audio.currentTime /
                    audio.duration;

            }


            /*
                Ambil data audio.
            */

            if (
                analyser &&
                !audio.paused
            ) {

                analyser.getByteFrequencyData(
                    frequencyData
                );

            }


            /*
                Jika pause,
                spectrum tidak langsung hilang.
            */

            for (
                let i = 0;
                i < BAR_COUNT;
                i++
            ) {

                let raw =
                    getFrequencyValue(i);


                /*
                    Sedikit variasi supaya
                    tidak semuanya rata.
                */

                const wave =
                    Math.sin(
                        performance.now() *
                        0.003 +
                        i *
                        0.61
                    );


                raw =
                    raw +
                    Math.max(
                        0,
                        wave
                    ) *
                    7;


                /*
                    Normalisasi.
                */

                let target =
                    raw / 255;


                /*
                    Bass dibuat lebih kuat.
                */

                if (
                    i <
                    BAR_COUNT * 0.30
                ) {

                    target *= 1.25;

                }


                target =
                    Math.min(
                        1,
                        target
                    );


                /*
                    Minimum movement
                    ketika sedang play.
                */

                if (
                    !audio.paused &&
                    target < 0.025
                ) {

                    target =
                        0.025 +
                        Math.random() * 0.025;

                }


                /*
                    Smooth movement.
                */

                const speed =
                    target >
                    smoothBars[i]
                        ? 0.32
                        : 0.14;


                smoothBars[i] +=
                    (
                        target -
                        smoothBars[i]
                    ) *
                    speed;


                bars[i] =
                    smoothBars[i];

            }


            /* =====================================
               BAR GEOMETRY
            ====================================== */

            const gap =
                Math.max(
                    1.4,
                    width /
                    BAR_COUNT *
                    0.16
                );


            const barWidth =
                (
                    width -
                    gap *
                    (BAR_COUNT - 1)
                ) /
                BAR_COUNT;


            const centerY =
                height / 2;


            const maxHeight =
                height * 0.43;


            /* =====================================
               GLOW LAYER
            ====================================== */

            canvasContext.save();


            canvasContext.shadowBlur = 9;


            canvasContext.shadowColor =
                "rgba(255,105,30,0.40)";


            /* =====================================
               DRAW BARS
            ====================================== */

            for (
                let i = 0;
                i < BAR_COUNT;
                i++
            ) {

                const x =
                    i *
                    (barWidth + gap);


                /*
                    Bentuk tidak seragam.
                */

                const shape =
                    0.72 +
                    Math.sin(
                        i * 1.91
                    ) *
                    0.16 +
                    Math.sin(
                        i * 0.47
                    ) *
                    0.12;


                let barHeight =
                    bars[i] *
                    maxHeight *
                    shape;


                /*
                    Sedikit variasi.
                */

                barHeight *=
                    0.90 +
                    Math.sin(
                        performance.now() *
                        0.002 +
                        i
                    ) *
                    0.04;


                /*
                    Minimal tinggi kecil
                    ketika sedang bermain.
                */

                if (
                    !audio.paused &&
                    barHeight < 2
                ) {

                    barHeight = 2;

                }


                const top =
                    centerY -
                    barHeight;


                const bottom =
                    centerY +
                    barHeight;


                /*
                    Progress menentukan
                    warna orange.
                */

                const barProgress =
                    i /
                    BAR_COUNT;


                const isPlayed =
                    barProgress <= progress;


                if (isPlayed) {

                    /*
                        Orange untuk bagian
                        lagu yang sudah dilewati.
                    */

                    canvasContext.fillStyle =
                        "#ff7a24";

                    canvasContext.shadowColor =
                        "rgba(255,95,20,0.62)";

                } else {

                    /*
                        Bagian yang belum
                        dilewati tetap terang.
                    */

                    canvasContext.fillStyle =
                        "rgba(255,255,255,0.88)";

                    canvasContext.shadowColor =
                        "rgba(255,255,255,0.18)";

                }


                /*
                    Rounded bar.
                */

                const radius =
                    Math.min(
                        barWidth / 2,
                        4
                    );


                canvasContext.beginPath();


                roundRect(
                    canvasContext,
                    x,
                    top,
                    barWidth,
                    Math.max(
                        2,
                        barHeight * 2
                    ),
                    radius
                );


                canvasContext.fill();

            }


            canvasContext.restore();


            requestAnimationFrame(
                drawSpectrum
            );

        }


        /* =========================================
           ROUND RECT
        ========================================= */

        function roundRect(
            ctx,
            x,
            y,
            width,
            height,
            radius
        ) {

            radius =
                Math.min(
                    radius,
                    width / 2,
                    height / 2
                );


            ctx.moveTo(
                x + radius,
                y
            );


            ctx.arcTo(
                x + width,
                y,
                x + width,
                y + height,
                radius
            );


            ctx.arcTo(
                x + width,
                y + height,
                x,
                y + height,
                radius
            );


            ctx.arcTo(
                x,
                y + height,
                x,
                y,
                radius
            );


            ctx.arcTo(
                x,
                y,
                x + width,
                y,
                radius
            );


            ctx.closePath();

        }


        /* =========================================
           START SPECTRUM
        ========================================= */

        drawSpectrum();


        /* =========================================
           INITIAL COVER
        ========================================= */

        setCover(
            coverImage.src
        );


        /* =========================================
           DOUBLE CLICK TITLE
        ========================================= */

        songTitle.addEventListener(
            "dblclick",
            function () {

                const current =
                    songTitle.textContent.trim();


                const result =
                    prompt(
                        "Edit judul musik:",
                        current
                    );


                if (
                    result !== null &&
                    result.trim() !== ""
                ) {

                    songTitle.textContent =
                        result.trim();

                    updateTitleScrolling();

                }

            }
        );


        /* =========================================
           KEYBOARD
        ========================================= */

        document.addEventListener(
            "keydown",
            async function (event) {

                /*
                    Space = play/pause
                */

                if (
                    event.code === "Space" &&
                    event.target.tagName !== "INPUT"
                ) {

                    event.preventDefault();

                    await resumeAudioContext();


                    if (!audio.src) {

                        audioInput.click();

                        return;

                    }


                    if (audio.paused) {

                        audio.play();

                    } else {

                        audio.pause();

                    }

                }

            }
        );


        /* =========================================
           PREVENT LONG PRESS IMAGE
        ========================================= */

        coverImage.addEventListener(
            "contextmenu",
            function (event) {

                event.preventDefault();

            }
        );


    </script>

</body>
